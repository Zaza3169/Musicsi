<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music316">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <title>Music316</title>
    <style>
        :root {
            --bg: #000; --card: #1c1c1e; --accent: #ff2d3f; --gray: #8e8e93;
            --light-gray: #2c2c2e; --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; margin: 0; padding: 0 20px calc(220px + var(--safe-bottom)); overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
        body.panel-expanded { overflow: hidden; }

        header { padding: calc(20px + var(--safe-top)) 0 0; }

        /* Barra con "Todas / Mi Lista" y el buscador: se esconde al bajar y reaparece con solo subir un poco */
        .status-cover { position: fixed; top: 0; left: 0; right: 0; height: var(--safe-top); background: var(--bg); z-index: 950; pointer-events: none; }
        .sticky-bar { position: sticky; top: var(--safe-top); z-index: 900; background: var(--bg); padding: 2px 0 14px; transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform; }
        .sticky-bar.hide { transform: translate3d(0, calc(-100% - var(--safe-top) - 4px), 0); }

        .version-text { font-size: 12px; color: var(--gray); margin-top: 4px; margin-bottom: 20px; display: block; font-weight: 600; }
        h1 { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }

        svg { fill: currentColor; width: 24px; height: 24px; }
        .icon-btn { background: none; border: none; color: white; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-btn:active { opacity: 0.5; }

        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600;
            opacity: 0; transition: all 0.3s ease; pointer-events: none; z-index: 2000;
            border: 0.5px solid rgba(255,255,255,0.2); text-align: center; width: 80%; max-width: 300px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .tabs { display: flex; background: var(--light-gray); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
        .tab { flex: 1; text-align: center; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--gray); cursor: pointer; transition: 0.2s; }
        .tab.active { background: var(--card); color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

        .add-container { position: relative; width: 100%; margin-bottom: 16px; }
        .add-label { display: flex; width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: white; font-size: 16px; font-weight: 600; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        #file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; font-size: 16px; }

        .search-container { position: relative; width: 100%; margin-bottom: 0; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--gray); pointer-events: none; }
        #search-input { width: 100%; background: var(--light-gray); border: none; border-radius: 10px; color: white; font-size: 16px; padding: 11px 40px 11px 40px; outline: none; -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text; }
        #search-input::placeholder { color: var(--gray); }
        #search-input::-webkit-search-cancel-button { -webkit-appearance: none; }
        .search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: none; background: none; border: none; color: var(--gray); padding: 8px; align-items: center; justify-content: center; cursor: pointer; }
        .search-clear svg { width: 18px; height: 18px; }

        .song-wrapper { position: relative; margin-bottom: 2px; height: 64px; background: var(--accent); overflow: hidden; border-radius: 10px; touch-action: pan-y; }
        .swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 20px; font-weight: 600; color: white; font-size: 15px; gap: 8px; }

        .swipe-del { position: absolute; top: 0; right: 0; bottom: 0; width: 96px; background: #ff3b30; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 15px; color: white; cursor: pointer; z-index: 1; }
        .swipe-del svg { width: 20px; height: 20px; }

        .song-content { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; padding: 0 12px; z-index: 2; border-bottom: 0.5px solid #222; gap: 12px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }

        .song-content.active .song-title { color: var(--accent); font-weight: 700; }
        .song-content.active .song-cover { color: var(--accent); }

        .song-cover { overflow: hidden; width: 48px; height: 48px; border-radius: 8px; background: var(--light-gray); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--gray); transition: color 0.2s; }
        .song-meta { flex: 1; min-width: 0; }
        .song-title { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
        .song-artist { font-size: 13px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .mini-player { position: fixed; bottom: calc(12px + var(--safe-bottom)); left: 12px; right: 12px; background: rgba(44, 44, 46, 0.95); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.5); transition: transform 0.3s ease, opacity 0.3s ease; }
        .mini-player.hidden { transform: translateY(120%); opacity: 0; pointer-events: none; }
        .mini-cover { overflow: hidden; width: 40px; height: 40px; border-radius: 6px; background: var(--light-gray); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--gray); }
        .mini-meta { flex: 1; min-width: 0; }
        .mini-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-panel { position: fixed; left: 0; right: 0; bottom: 0; background: #1c1c1e; z-index: 1000; border-top: 0.5px solid #333; height: 92dvh; height: 92vh; transform: translate3d(0, calc(92vh - 170px), 0); transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform; display: flex; flex-direction: column; padding-bottom: var(--safe-bottom); }
        @supports (height: 92dvh) { .player-panel { height: 92dvh; transform: translate3d(0, calc(92dvh - 170px), 0); } }
        .player-panel.expanded { transform: translate3d(0, 0, 0); border-radius: 20px 20px 0 0; }
        .player-panel.dragging { transition: none; }
        .player-panel:not(.expanded) { touch-action: none; }

        .drag-area { cursor: grab; touch-action: none; padding-bottom: 10px; }
        .drag-handle { width: 40px; height: 5px; background: #555; border-radius: 3px; margin: 10px auto; }

        .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; color: var(--gray); }
        .cover-large { overflow: hidden; width: min(75vw, 300px); height: min(75vw, 300px); border-radius: 16px; background: var(--light-gray); margin: 10px auto 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--gray); }
        .cover-large svg { width: 80px; height: 80px; }
        .song-cover img, .mini-cover img, .cover-large img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-touch-callout: none; }
        .track-info { text-align: center; padding: 0 30px; margin-bottom: 10px; }
        .track-title { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 16px; color: var(--gray); margin-top: 4px; }
        .controls-container { padding: 0 30px; margin-top: auto; }

        input[type="range"] { width: 100%; accent-color: white; margin: 20px 0 10px; height: 3px; background: #444; border-radius: 2px; appearance: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: white; cursor: pointer; }

        .time-info { display: flex; justify-content: space-between; color: var(--gray); font-size: 12px; margin-bottom: 10px; }
        .main-controls { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }

        .main-controls .icon-btn svg { width: 32px; height: 32px; }
        .main-controls .btn-play-main svg { width: 54px; height: 54px; fill: white; }
        .main-controls .icon-btn.active { color: var(--accent); }

        .empty-state { text-align: center; color: var(--gray); padding: 60px 20px; font-size: 15px; }

        .reset-btn { background: #ff3b30; color: white; border: none; padding: 10px; border-radius: 10px; margin-top: 30px; width: 100%; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

<div id="toast" class="toast">Añadida a Mi Lista</div>

<div class="status-cover"></div>

<header>
    <h1>Music316</h1>
    <span class="version-text" id="app-version">By zaza</span>

    <div class="add-container">
        <div class="add-label">＋ Añadir Música</div>
        <!-- Sin "accept": así el teléfono no pone en gris ningún archivo. La app filtra después lo que no sea audio. -->
        <input type="file" id="file-input" multiple>
    </div>
</header>

<div class="sticky-bar" id="sticky-bar">
    <div class="tabs">
        <div class="tab active" id="tab-all">Todas</div>
        <div class="tab" id="tab-playlist">Mi Lista</div>
    </div>

    <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="search" id="search-input" placeholder="Buscar canciones" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="search-clear" id="search-clear" aria-label="Borrar búsqueda">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>
</div>

<main id="song-list">
    <div class="empty-state" id="empty-msg">Cargando biblioteca...</div>
</main>

<div class="mini-player hidden" id="mini-player">
    <div class="mini-cover" id="mini-cover"></div>
    <div class="mini-meta">
        <div class="mini-title" id="mini-title">Sin reproducción</div>
        <div class="mini-artist" id="mini-artist">—</div>
    </div>
    <button class="icon-btn" id="mini-play">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
</div>

<div class="player-panel" id="player-panel">
    <div class="drag-area" id="drag-area">
        <div class="drag-handle"></div>
        <div class="panel-header">
            <button class="icon-btn" id="btn-collapse">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
            <span class="title" style="font-size:12px; font-weight:600;">REPRODUCIENDO</span>
            <button class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </button>
        </div>
    </div>

    <div class="cover-large" id="cover-large"></div>
    <div class="track-info">
        <div class="track-title" id="track-title">Ninguna canción</div>
        <div class="track-artist" id="track-artist">—</div>
    </div>

    <div class="controls-container">
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1">
        <div class="time-info">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="main-controls">
            <button class="icon-btn" id="btn-shuffle">
                <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <button class="icon-btn" id="btn-prev">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="icon-btn btn-play-main" id="btn-play">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="icon-btn" id="btn-next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="icon-btn" id="btn-repeat">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
        </div>
    </div>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
    const APP_VERSION = "Versión 7.0 (Music316)";
    document.getElementById('app-version').addEventListener('click', () => showToast(APP_VERSION));

    /* ============ Service Worker (para instalar y usar sin conexión) ============ */
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
        });
    }

    /* ============ Base de datos (IndexedDB) ============
       - 'songs': datos ligeros de cada canción (nombre, tipo, tamaño...)
       - 'files': el audio en sí (ArrayBuffer). Se separa para no cargar todo en memoria al abrir la app. */
    const DB_NAME = 'SpotijaiDB_V5';
    let db = null;

    function initDB() {
        return new Promise((resolve, reject) => {
            if (!window.indexedDB) return reject(new Error('IndexedDB no disponible'));
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains('songs')) d.createObjectStore('songs', { keyPath: 'id' });
                if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });
            };
            req.onsuccess = (e) => {
                db = e.target.result;
                // iOS puede cerrar la conexión al pasar la app a segundo plano: se reabre cuando hace falta
                db.onclose = () => { db = null; };
                db.onversionchange = () => { try { db.close(); } catch (x) {} db = null; };
                resolve();
            };
            req.onerror = () => reject(req.error);
            req.onblocked = () => reject(new Error('DB bloqueada'));
        });
    }

    // Ejecuta una operación y, si la conexión estaba cerrada, la reabre y reintenta una vez
    async function dbRun(fn) {
        try {
            if (!db) await initDB();
            return await fn();
        } catch (e) {
            if (e && e.name === 'InvalidStateError') {
                db = null;
                await initDB();
                return await fn();
            }
            throw e;
        }
    }

    function saveSongToDB(meta, buffer) {
        return dbRun(() => new Promise((resolve, reject) => {
            const tx = db.transaction(['songs', 'files'], 'readwrite');
            tx.objectStore('songs').put(meta);
            tx.objectStore('files').put({ id: meta.id, data: buffer });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('Transacción cancelada'));
        }));
    }

    function removeSongFromDB(id) {
        return dbRun(() => new Promise((resolve, reject) => {
            const tx = db.transaction(['songs', 'files'], 'readwrite');
            tx.objectStore('songs').delete(id);
            tx.objectStore('files').delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('Transacción cancelada'));
        }));
    }

    // Actualiza los datos de una canción que ya existe (no la crea de nuevo si la borraste mientras tanto)
    function updateSongMeta(meta) {
        return dbRun(() => new Promise((resolve, reject) => {
            const tx = db.transaction('songs', 'readwrite');
            const st = tx.objectStore('songs');
            const g = st.get(meta.id);
            g.onsuccess = () => { if (g.result) st.put(meta); };
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('Transacción cancelada'));
        }));
    }

    function getSongsFromDB() {
        return dbRun(() => new Promise((resolve, reject) => {
            const req = db.transaction('songs', 'readonly').objectStore('songs').getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
        }));
    }

    function getFileFromDB(id) {
        return dbRun(() => new Promise((resolve, reject) => {
            const req = db.transaction('files', 'readonly').objectStore('files').get(id);
            req.onsuccess = () => resolve(req.result ? req.result.data : null);
            req.onerror = () => reject(req.error);
        }));
    }

    /* ============ Utilidades ============ */
    const svgMusic = '<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>';
    const svgPlay = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const svgPause = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    const PLAYLIST_KEY = 'spotijai_playlist';
    function loadPlaylist() {
        try { return JSON.parse(localStorage.getItem(PLAYLIST_KEY)) || []; } catch (e) { return []; }
    }
    function savePlaylist() {
        try { localStorage.setItem(PLAYLIST_KEY, JSON.stringify(state.playlist)); } catch (e) {}
    }

    const MODE_KEY = 'music316_modes';
    function loadModes() {
        try { return JSON.parse(localStorage.getItem(MODE_KEY)) || {}; } catch (e) { return {}; }
    }
    const savedModes = loadModes();
    const state = { songs: [], playlist: loadPlaylist(), history: [], currentId: null, isPlaying: false, currentTab: 'all',
                    shuffle: !!savedModes.shuffle, repeat: ['off', 'all', 'one'].includes(savedModes.repeat) ? savedModes.repeat : 'off' };
    let shuffleBag = null;   // canciones que aún no han sonado en esta vuelta aleatoria (null = vuelta nueva)
    function saveModes() {
        try { localStorage.setItem(MODE_KEY, JSON.stringify({ shuffle: state.shuffle, repeat: state.repeat })); } catch (e) {}
    }
    const memFiles = {};   // respaldo en memoria si la base de datos falla
    let dbOk = false;
    const $ = (id) => document.getElementById(id);
    const audio = $('audio');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const MIME_BY_EXT = { mp3: 'audio/mpeg', m4a: 'audio/mp4', mp4: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav', ogg: 'audio/ogg', oga: 'audio/ogg', flac: 'audio/flac', opus: 'audio/ogg' };
    function guessMime(file) {
        if (file.type && file.type.startsWith('audio/')) return file.type;
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        return MIME_BY_EXT[ext] || 'audio/mpeg';
    }

    function isAudioFile(file) {
        if (file.type && file.type.startsWith('audio/')) return true;
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        if (ext in MIME_BY_EXT) return true;
        // Algunos teléfonos no informan el tipo: se acepta y se descarta solo lo que claramente no es audio
        const t = file.type || '';
        return !(t.startsWith('image/') || t.startsWith('video/') || t.startsWith('text/') || t === 'application/pdf');
    }

    let toastTimeout;
    function showToast(msg, ms = 3000) {
        const toast = $('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), ms);
    }

    function errName(e) { return (e && (e.name || e.message)) || 'error desconocido'; }
    async function storageInfo() {
        try {
            const e = await navigator.storage.estimate();
            return Math.round(e.usage / 1048576) + ' MB usados de ' + Math.round(e.quota / 1048576) + ' MB';
        } catch (x) { return ''; }
    }
    let dbError = '';

    /* ============ Carátulas (la imagen que lleva cada archivo de música) ============ */
    const u8str = (u, a, b) => { let t = ''; for (let i = a; i < b && i < u.length; i++) t += String.fromCharCode(u[i]); return t; };
    const syncsafeAt = (u, o) => ((u[o] & 0x7f) << 21) | ((u[o + 1] & 0x7f) << 14) | ((u[o + 2] & 0x7f) << 7) | (u[o + 3] & 0x7f);

    // Reconoce el tipo de imagen por sus primeros bytes (no se confía en lo que diga el archivo)
    function sniffImageType(u, o) {
        if (u[o] === 0xFF && u[o + 1] === 0xD8 && u[o + 2] === 0xFF) return 'image/jpeg';
        if (u[o] === 0x89 && u[o + 1] === 0x50 && u[o + 2] === 0x4E && u[o + 3] === 0x47) return 'image/png';
        if (u[o] === 0x47 && u[o + 1] === 0x49 && u[o + 2] === 0x46 && u[o + 3] === 0x38) return 'image/gif';
        if (u[o] === 0x52 && u[o + 1] === 0x49 && u[o + 2] === 0x46 && u[o + 3] === 0x46 && u8str(u, o + 8, o + 12) === 'WEBP') return 'image/webp';
        if (u[o] === 0x42 && u[o + 1] === 0x4D && u[o + 5] === 0x00) return 'image/bmp';
        return '';
    }

    // MP3 (y otros con etiqueta ID3): fotograma APIC / PIC
    function parseApic(b, s0, e, isV2) {
        let p = s0 + 1;
        const enc = b[s0];
        if (isV2) p += 3;
        else { const z = b.indexOf(0, p); if (z < 0 || z >= e) return null; p = z + 1; }
        const kind = b[p]; p++;
        if (enc === 1 || enc === 2) { while (p + 1 < e && !(b[p] === 0 && b[p + 1] === 0)) p += 2; p += 2; }
        else { while (p < e && b[p] !== 0) p++; p += 1; }
        let type = sniffImageType(b, p);
        if (!type) {   // respaldo: busca el inicio de la imagen en los primeros bytes del fotograma
            for (let q = s0; q < Math.min(e - 4, s0 + 600); q++) { const t = sniffImageType(b, q); if (t) { p = q; type = t; break; } }
        }
        if (!type || p >= e) return null;
        return { kind, type, bytes: b.subarray(p, e) };
    }

    function id3Cover(buf) {
        const u = new Uint8Array(buf);
        if (u.length < 10 || u[0] !== 0x49 || u[1] !== 0x44 || u[2] !== 0x33) return null;   // "ID3"
        const ver = u[3], flags = u[5];
        if (ver < 2 || ver > 4) return null;
        const end = Math.min(10 + syncsafeAt(u, 6), u.length);
        let body = u.subarray(10, end);
        if ((flags & 0x80) && ver < 4) {   // "unsynchronisation": quita el 00 que sigue a cada FF
            const out = new Uint8Array(body.length); let n = 0;
            for (let i = 0; i < body.length; i++) { out[n++] = body[i]; if (body[i] === 0xFF && body[i + 1] === 0x00) i++; }
            body = out.subarray(0, n);
        }
        let pos = 0;
        if (ver >= 3 && (flags & 0x40) && body.length >= 4) {   // cabecera extendida: se salta
            const sz = ver === 4 ? syncsafeAt(body, 0) : (((body[0] << 24) | (body[1] << 16) | (body[2] << 8) | body[3]) >>> 0);
            pos = ver === 4 ? sz : sz + 4;
        }
        const idLen = ver === 2 ? 3 : 4, hdrLen = ver === 2 ? 6 : 10;
        let best = null;
        while (pos + hdrLen <= body.length) {
            if (body[pos] === 0) break;   // relleno al final de la etiqueta
            const id = u8str(body, pos, pos + idLen);
            let size;
            if (ver === 2) size = (body[pos + 3] << 16) | (body[pos + 4] << 8) | body[pos + 5];
            else if (ver === 4) size = syncsafeAt(body, pos + 4);
            else size = ((body[pos + 4] << 24) | (body[pos + 5] << 16) | (body[pos + 6] << 8) | body[pos + 7]) >>> 0;
            const ds = pos + hdrLen;
            if (size <= 0 || ds + size > body.length) break;
            if (id === 'APIC' || id === 'PIC') {
                let fs = ds;
                if (ver === 4 && (body[pos + 9] & 0x01)) fs += 4;   // el fotograma trae un indicador de longitud
                const pic = parseApic(body, fs, ds + size, ver === 2);
                if (pic) { if (pic.kind === 3) return pic; if (!best) best = pic; }   // 3 = portada frontal
            }
            pos = ds + size;
        }
        return best;
    }

    // M4A / MP4 / AAC de iTunes: átomo "covr"
    function mp4Cover(buf) {
        const u = new Uint8Array(buf);
        if (u.length < 16 || u8str(u, 4, 8) !== 'ftyp') return null;
        const dv = new DataView(buf);
        function walk(start, end, path) {
            let pos = start;
            while (pos + 8 <= end) {
                let size = dv.getUint32(pos), hdr = 8;
                const type = u8str(u, pos + 4, pos + 8);
                if (size === 1) { if (pos + 16 > end) break; size = dv.getUint32(pos + 8) * 4294967296 + dv.getUint32(pos + 12); hdr = 16; }
                else if (size === 0) size = end - pos;
                if (size < hdr || pos + size > end) break;
                if (type === path[0]) {
                    if (path.length === 1) return { start: pos + hdr, end: pos + size };
                    const r = walk(pos + hdr + (type === 'meta' ? 4 : 0), pos + size, path.slice(1));
                    if (r) return r;
                }
                pos += size;
            }
            return null;
        }
        const covr = walk(0, u.length, ['moov', 'udta', 'meta', 'ilst', 'covr']);
        if (!covr) return null;
        let pos = covr.start;
        while (pos + 16 <= covr.end) {   // cada "data": tamaño, "data", versión+flags, reservado, imagen
            const size = dv.getUint32(pos);
            if (size < 16 || pos + size > covr.end) break;
            if (u8str(u, pos + 4, pos + 8) === 'data') {
                const type = sniffImageType(u, pos + 16);
                if (type) return { kind: 3, type, bytes: u.subarray(pos + 16, pos + size) };
            }
            pos += size;
        }
        return null;
    }

    // FLAC: bloque PICTURE
    function flacCover(buf) {
        const u = new Uint8Array(buf);
        if (u.length < 8 || u8str(u, 0, 4) !== 'fLaC') return null;
        const dv = new DataView(buf);
        let pos = 4, best = null;
        while (pos + 4 <= u.length) {
            const h = u[pos], last = h & 0x80, type = h & 0x7f;
            const len = (u[pos + 1] << 16) | (u[pos + 2] << 8) | u[pos + 3];
            const ds = pos + 4;
            if (ds + len > u.length) break;
            if (type === 6) {
                try {
                    let p = ds;
                    const kind = dv.getUint32(p); p += 4;
                    p += 4 + dv.getUint32(p);   // tipo MIME
                    p += 4 + dv.getUint32(p);   // descripción
                    p += 16;                    // ancho, alto, profundidad, colores
                    const il = dv.getUint32(p); p += 4;
                    if (p + il <= ds + len) {
                        const t = sniffImageType(u, p);
                        if (t) { const pic = { kind, type: t, bytes: u.subarray(p, p + il) }; if (kind === 3) return pic; if (!best) best = pic; }
                    }
                } catch (e) {}
            }
            if (last) break;
            pos = ds + len;
        }
        return best;
    }

    function rawCover(buf) {
        try { return id3Cover(buf) || mp4Cover(buf) || flacCover(buf) || null; } catch (e) { return null; }
    }

    function readBlob(blob) {
        if (blob.arrayBuffer) return blob.arrayBuffer();
        return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(blob); });
    }

    // Reduce la imagen a un cuadrado de 320 px: ocupa poco espacio y carga al instante
    function makeThumb(pic) {
        return new Promise((resolve) => {
            const fallback = () => resolve(pic.bytes.length <= 400000 ? { data: pic.bytes.slice().buffer, type: pic.type } : null);
            let url = '';
            const free = () => { if (url) { try { URL.revokeObjectURL(url); } catch (e) {} url = ''; } };
            try {
                url = URL.createObjectURL(new Blob([pic.bytes], { type: pic.type }));
                const img = new Image();
                const timer = setTimeout(() => { free(); fallback(); }, 8000);
                img.onload = () => {
                    clearTimeout(timer);
                    try {
                        const w = img.naturalWidth, h = img.naturalHeight;
                        if (!w || !h) { free(); return fallback(); }
                        const side = Math.min(w, h), out = Math.min(320, side);
                        const c = document.createElement('canvas');
                        c.width = c.height = out;
                        c.getContext('2d').drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, out, out);
                        free();
                        c.toBlob((blob) => {
                            if (!blob) return fallback();
                            readBlob(blob).then(data => resolve({ data, type: blob.type || 'image/jpeg' }), fallback);
                        }, 'image/jpeg', 0.85);
                    } catch (e) { free(); fallback(); }
                };
                img.onerror = () => { clearTimeout(timer); free(); fallback(); };
                img.src = url;
            } catch (e) { free(); fallback(); }
        });
    }

    async function coverFromBuffer(buf) {
        const pic = rawCover(buf);
        return pic ? await makeThumb(pic) : null;
    }

    const coverUrls = new Map();
    function getCoverUrl(song) {
        if (!song || !song.cover) return '';
        let u = coverUrls.get(song.id);
        if (!u) { u = URL.createObjectURL(new Blob([song.cover], { type: song.coverType || 'image/jpeg' })); coverUrls.set(song.id, u); }
        return u;
    }
    function dropCoverUrl(id) { const u = coverUrls.get(id); if (u) { try { URL.revokeObjectURL(u); } catch (e) {} coverUrls.delete(id); } }
    function coverImg(song) { const u = getCoverUrl(song); return u ? `<img src="${u}" alt="" draggable="false">` : ''; }
    let shownCoverFor = null;   // evita volver a dibujar la misma imagen en el reproductor

    function refreshCoverInDom(id) {
        const song = state.songs.find(x => x.id === id);
        if (!song) return;
        document.querySelectorAll('.song-content').forEach(el => {
            if (el.dataset.id === id) { const c = el.querySelector('.song-cover'); if (c) c.innerHTML = coverImg(song) || svgMusic; }
        });
        if (state.currentId === id) { shownCoverFor = null; updateUI(); }
    }

    // Canciones que ya habías guardado antes de esta versión: se busca su imagen una sola vez, en segundo plano
    async function backfillCovers() {
        if (!dbOk) return;
        const todo = state.songs.filter(x => !x.coverChecked);
        if (!todo.length) return;
        let found = 0;
        for (const song of todo) {
            try {
                const buf = await getFileFromDB(song.id);
                if (buf) {
                    const cv = await coverFromBuffer(buf);
                    if (cv) { song.cover = cv.data; song.coverType = cv.type; }
                }
                song.coverChecked = true;
                if (!state.songs.includes(song)) continue;   // la borraste mientras tanto
                await updateSongMeta(song);
                if (song.cover) { found++; refreshCoverInDom(song.id); }
            } catch (e) { /* se intenta con la siguiente */ }
            await new Promise(r => setTimeout(r, 20));
        }
        if (found) showToast('🖼️ ' + found + ' carátula(s) encontradas', 3500);
    }

    /* ============ Importar canciones ============ */
    $('file-input').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (files.length === 0) return;

        $('empty-msg') && ($('empty-msg').style.display = 'none');
        showToast('⏳ Guardando ' + files.length + ' archivo(s)...', 6000);

        let added = 0, temp = 0, skipped = 0, failed = 0, lastErr = '';

        // Uno por uno para no saturar la memoria del teléfono
        for (const file of files) {
            if (!file.size || !isAudioFile(file)) { failed++; continue; }

            const name = file.name.replace(/\.[^.]+$/, '');
            if (state.songs.some(s => s.name === name && s.size === file.size)) { skipped++; continue; }

            const meta = {
                id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
                name,
                artist: 'Archivo local',
                type: guessMime(file),
                size: file.size,
                addedAt: Date.now()
            };

            let buffer;
            try {
                buffer = await file.arrayBuffer();
            } catch (err) {
                console.error('No se pudo leer el archivo:', err);
                failed++; lastErr = errName(err);
                continue;
            }

            // Imagen incrustada en el archivo (si tiene)
            try {
                const cv = await coverFromBuffer(buffer);
                if (cv) { meta.cover = cv.data; meta.coverType = cv.type; }
            } catch (err) {}
            meta.coverChecked = true;

            let saved = false;
            if (dbOk) {
                try {
                    await saveSongToDB(meta, buffer);
                    // Verifica que de verdad quedó guardada leyéndola de vuelta
                    const check = await getFileFromDB(meta.id);
                    if (!check || check.byteLength !== buffer.byteLength) throw new Error('Verificación fallida');
                    saved = true;
                } catch (err) {
                    console.error('Error guardando en la base de datos:', err);
                    lastErr = errName(err);
                    try { await removeSongFromDB(meta.id); } catch (x) {}
                }
            } else {
                lastErr = dbError;
            }

            if (saved) {
                state.songs.push(meta);
                if (shuffleBag) shuffleBag.push(meta.id);
                added++;
            } else {
                // Solo disponible mientras la app esté abierta
                memFiles[meta.id] = new Blob([buffer], { type: meta.type });
                state.songs.push(meta);
                if (shuffleBag) shuffleBag.push(meta.id);
                temp++;
            }
        }

        renderSongs();

        // Pide al navegador que no borre las canciones guardadas
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

        let msg = '';
        if (added) msg += '✅ ' + added + ' guardada(s)';
        if (skipped) msg += (msg ? ' · ' : '') + skipped + ' repetida(s)';
        if (failed) msg += (msg ? ' · ' : '') + failed + ' con error';
        if (temp) {
            const info = await storageInfo();
            msg += (msg ? ' · ' : '') + '⚠️ ' + temp + ' NO se pudieron guardar (' + lastErr + ') y se perderán al cerrar la app.' + (info ? ' Espacio: ' + info + '.' : '');
            showToast(msg, 12000);
        } else {
            showToast(msg || '✅ Listo', 3500);
        }
    });

    /* ============ Buscador ============ */
    let searchQuery = '';
    const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    function applySearch(list) {
        const q = norm(searchQuery).trim();
        return q ? list.filter(s => norm(s.name + ' ' + s.artist).includes(q)) : list;
    }

    // Biblioteca completa, en el orden en que se añadieron las canciones
    function getLibrarySongs() { return applySearch(state.songs); }

    // "Todas" = biblioteca. "Mi Lista" = cola de continuación, en el orden en que las fuiste añadiendo
    function getDisplaySongs() {
        if (state.currentTab === 'playlist') {
            const byId = new Map(state.songs.map(s => [s.id, s]));
            return applySearch(state.playlist.map(id => byId.get(id)).filter(Boolean));
        }
        return getLibrarySongs();
    }

    const searchInput = $('search-input');
    const searchClear = $('search-clear');
    searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        searchClear.style.display = searchQuery ? 'flex' : 'none';
        renderSongs();
    });
    searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        searchClear.style.display = 'none';
        renderSongs();
        searchInput.focus();
    });

    /* ============ Pestañas y lista ============ */
    $('tab-all').addEventListener('click', () => { state.currentTab = 'all'; updateTabs(); renderSongs(); });
    $('tab-playlist').addEventListener('click', () => { state.currentTab = 'playlist'; updateTabs(); renderSongs(); });

    function updateTabs() {
        $('tab-all').classList.toggle('active', state.currentTab === 'all');
        $('tab-playlist').classList.toggle('active', state.currentTab === 'playlist');
    }

    function formatTime(sec) { if (!isFinite(sec)) return '0:00'; const m = Math.floor(sec / 60); const s = Math.floor(sec % 60).toString().padStart(2, '0'); return `${m}:${s}`; }

    const songListEl = $('song-list');

    const DEL_W = 96;
    const SNAP = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
    const svgTrash = '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
    let openRow = null;   // fila que tiene abierto el botón rojo

    function renderSongs() {
        songListEl.innerHTML = '';
        openRow = null;
        const displaySongs = getDisplaySongs();
        const inQueue = state.currentTab === 'playlist';

        if (displaySongs.length === 0) {
            songListEl.innerHTML = searchQuery.trim()
                ? `<div class="empty-state">Sin resultados para "${escapeHtml(searchQuery.trim())}"</div>`
                : `<div class="empty-state">
                ${inQueue ? 'Tu lista está vacía.<br>Desliza una canción a la derecha para añadirla.<br>Las canciones de aquí suenan a continuación y se quitan al escucharlas.' : 'No hay canciones guardadas.<br><br><button class="reset-btn" onclick="resetDB()">Borrar Base de Datos</button>'}
            </div>`;
            return;
        }

        displaySongs.forEach(song => {
            const wrapper = document.createElement('div');
            wrapper.className = 'song-wrapper';
            wrapper.innerHTML = `
                <div class="swipe-bg">
                    <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Añadir a Mi Lista
                </div>
                <div class="swipe-del">${svgTrash}${inQueue ? 'Quitar' : 'Borrar'}</div>
                <div class="song-content ${song.id === state.currentId ? 'active' : ''}" data-id="${song.id}">
                    <div class="song-cover">${coverImg(song) || svgMusic}</div>
                    <div class="song-meta">
                        <div class="song-title">${escapeHtml(song.name)}</div>
                        <div class="song-artist">${escapeHtml(song.artist)}</div>
                    </div>
                </div>`;

            const content = wrapper.querySelector('.song-content');
            const delEl = wrapper.querySelector('.swipe-del');
            let startX = 0, startY = 0, dx = 0, isDragging = false, lastTouch = 0, isOpen = false;

            const row = {
                close() {
                    isOpen = false;
                    content.style.transition = SNAP;
                    content.style.transform = 'translateX(0)';
                    if (openRow === row) openRow = null;
                }
            };
            const openIt = () => {
                isOpen = true;
                openRow = row;
                content.style.transition = SNAP;
                content.style.transform = `translateX(${-DEL_W}px)`;
            };

            content.addEventListener('touchstart', (e) => {
                if (openRow && openRow !== row) openRow.close();   // solo una fila abierta a la vez
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dx = 0;
                isDragging = true;
                content.style.transition = 'none';
            }, { passive: true });

            content.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const x = e.touches[0].clientX - startX;
                const y = e.touches[0].clientY - startY;
                if (Math.abs(y) > Math.abs(x)) return;
                dx = x;
                const base = isOpen ? -DEL_W : 0;
                const t = Math.max(-DEL_W - 24, Math.min(base + dx, 160));
                content.style.transform = `translateX(${t}px)`;
            }, { passive: true });

            content.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                isDragging = false;
                lastTouch = Date.now();
                const diffY = e.changedTouches[0].clientY - startY;
                const isTap = Math.abs(diffY) < 10 && Math.abs(dx) < 10;

                if (isTap) {
                    if (isOpen) row.close();
                    else { row.close(); playSong(song.id, { expand: true }); }
                } else if (!isOpen && dx < -50) {
                    openIt();                                  // deslizar a la izquierda: muestra "Borrar"
                } else if (!isOpen && dx > 80) {
                    addToPlaylist(song.id);                    // deslizar a la derecha: añadir a Mi Lista
                    row.close();
                } else if (isOpen && dx < 30) {
                    openIt();                                  // se queda abierta
                } else {
                    row.close();
                }
                dx = 0;
            });

            content.addEventListener('touchcancel', () => {
                isDragging = false;
                if (isOpen) openIt(); else row.close();
                dx = 0;
            });

            // Para ordenador (con el dedo ya se maneja arriba)
            content.addEventListener('click', () => {
                if (Date.now() - lastTouch < 600) return;
                if (isOpen) row.close(); else playSong(song.id, { expand: true });
            });

            delEl.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSong(song.id);
            });

            songListEl.appendChild(wrapper);
        });
    }

    // Detiene la reproducción y deja el reproductor vacío (se usa al borrar la canción que está sonando)
    function stopPlayback() {
        playToken++;
        dropPreload();
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
        state.currentId = null;
        state.isPlaying = false;
        shownCoverFor = null;
        $('mini-cover').innerHTML = '';
        $('cover-large').innerHTML = '';
        $('track-title').textContent = 'Ninguna canción';
        $('track-artist').textContent = '—';
        $('btn-play').innerHTML = svgPlay;
        $('mini-play').innerHTML = svgPlay;
        $('seek-bar').value = 0;
        $('current-time').textContent = '0:00';
        $('duration').textContent = '0:00';
        collapsePanel();
        mini.classList.add('hidden');
        if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = null; } catch (e) {} }
    }

    // En "Mi Lista" solo la quita de la cola; en "Todas" la borra de la app (con confirmación)
    async function deleteSong(id) {
        const song = state.songs.find(s => s.id === id);
        if (!song) return;

        if (state.currentTab === 'playlist') {
            state.playlist = state.playlist.filter(x => x !== id);
            savePlaylist();
            renderSongs();
            schedulePreload();
            showToast('Quitada de Mi Lista');
            return;
        }

        if (!confirm('¿Borrar "' + song.name + '" de Music316?')) {
            if (openRow) openRow.close();
            return;
        }

        try {
            if (dbOk) await removeSongFromDB(id);
        } catch (err) {
            console.error('No se pudo borrar:', err);
            showToast('❌ No se pudo borrar (' + errName(err) + ')');
            return;
        }

        delete memFiles[id];
        state.songs = state.songs.filter(s => s.id !== id);
        state.playlist = state.playlist.filter(x => x !== id);
        state.history = state.history.filter(x => x !== id);
        savePlaylist();
        if (state.currentId === id) stopPlayback();
        renderSongs();
        dropCoverUrl(id);
        schedulePreload();
        showToast('🗑️ Canción borrada');
    }

    function addToPlaylist(id) {
        if (!state.playlist.includes(id)) {
            state.playlist.push(id);
            savePlaylist();
            schedulePreload();
            if (navigator.vibrate) navigator.vibrate(50);
            showToast('✅ Añadida a Mi Lista');
        } else {
            showToast('Ya está en Mi Lista');
        }
    }

    /* ============ Reproducción ============ */
    // Desbloquea el audio en iPhone con el primer toque (permite reproducir tras cargar de la base de datos)
    const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
    let audioUnlocked = false;
    function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        if (audio.src) return;
        audio.src = SILENT;
        const p = audio.play();
        if (p && p.then) p.then(() => { if (audio.src === SILENT) audio.pause(); }).catch(() => {});
    }
    document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
    document.addEventListener('click', unlockAudio, { once: true });

    let currentUrl = null;
    async function getSongUrl(song) {
        let blob = memFiles[song.id];
        if (!blob) {
            const data = await getFileFromDB(song.id);
            if (!data) throw new Error('Archivo no encontrado');
            blob = new Blob([data], { type: song.type || 'audio/mpeg' });
        }
        return URL.createObjectURL(blob);
    }

    let playToken = 0;
    let errorSkips = 0;        // canciones seguidas que no se pudieron reproducir
    let errHandledFor = -1;    // para no tratar dos veces el mismo error

    // La siguiente canción se deja cargada en memoria mientras suena la actual. Al terminar, el cambio es
    // inmediato (sin esperar a la base de datos): así el teléfono no corta la música entre canciones,
    // sobre todo con la pantalla bloqueada o la app en segundo plano.
    let preload = { id: null, url: null, token: 0 };
    let preloadTimer = 0;
    function dropPreload() {
        if (preload.url) { try { URL.revokeObjectURL(preload.url); } catch (e) {} }
        preload = { id: null, url: null, token: preload.token + 1 };
    }
    function takePreload(id) {
        if (preload.id === id && preload.url) {
            const url = preload.url;
            preload = { id: null, url: null, token: preload.token + 1 };
            return url;
        }
        return null;
    }
    function schedulePreload() {
        clearTimeout(preloadTimer);
        preloadTimer = setTimeout(refreshPreload, 300);
    }
    async function refreshPreload() {
        if (!state.currentId || state.repeat === 'one') { dropPreload(); return; }
        const plan = planNext(true);
        if (!plan || plan.stop || plan.id === state.currentId) { dropPreload(); return; }
        if (preload.id === plan.id && preload.url) return;
        dropPreload();
        const mine = preload.token;
        const song = state.songs.find(x => x.id === plan.id);
        if (!song) return;
        try {
            const url = await getSongUrl(song);
            if (mine !== preload.token) { URL.revokeObjectURL(url); return; }
            preload.id = plan.id;
            preload.url = url;
        } catch (e) {}
    }

    // Marca la canción como "la que suena": historial, vuelta aleatoria, salir de Mi Lista, resaltado
    function selectTrack(id, opts) {
        if (!opts.noHistory && state.currentId && state.currentId !== id) {
            state.history.push(state.currentId);
            if (state.history.length > 50) state.history.shift();
        }
        if (shuffleBag) shuffleBag = shuffleBag.filter(x => x !== id);

        // Si estaba en Mi Lista, sale de la lista en cuanto empieza a sonar
        const qi = state.playlist.indexOf(id);
        if (qi !== -1) { state.playlist.splice(qi, 1); savePlaylist(); }

        state.currentId = id;
        if (qi !== -1 && state.currentTab === 'playlist') renderSongs();
        document.querySelectorAll('.song-content').forEach(el => {
            el.classList.toggle('active', el.dataset.id === id);
        });
    }

    async function playSong(id, opts = {}) {
        const song = state.songs.find(s => s.id === id);
        if (!song) return;

        const token = ++playToken;
        selectTrack(id, opts);
        state.isPlaying = false;
        if (opts.expand) expandPanel();   // se abre ya, mientras la canción carga
        updateUI();

        try {
            // Si ya estaba cargada de antemano, se cambia en este mismo instante
            let url = takePreload(id);
            if (!url) url = await getSongUrl(song);
            if (token !== playToken) { URL.revokeObjectURL(url); return; }
            const oldUrl = currentUrl;
            currentUrl = url;
            audio.src = url;
            const started = audio.play();
            if (oldUrl) URL.revokeObjectURL(oldUrl);
            await started;
            if (token !== playToken) return;
            state.isPlaying = true;
            errorSkips = 0;
            updateUI();
            registerMediaHandlers();
            schedulePreload();
        } catch (err) {
            if (token !== playToken) return;
            handlePlayError(err, song);
        }
    }

    function handlePlayError(err, song) {
        if (errHandledFor === playToken) return;
        errHandledFor = playToken;
        console.error('Error al reproducir:', err);
        const n = err && err.name;
        if (n === 'AbortError') return;                       // pausaste justo al empezar
        state.isPlaying = false;
        updateUI();
        if (n === 'NotAllowedError') {                         // el teléfono bloqueó el inicio automático
            showToast('▶️ Toca play para continuar', 5000);
            return;
        }
        // Archivo dañado o formato que el teléfono no puede reproducir: se salta a la siguiente
        errorSkips++;
        if (state.songs.length > 1 && errorSkips <= Math.min(5, state.songs.length - 1)) {
            showToast('⚠️ No se pudo reproducir "' + song.name + '". Pasando a la siguiente…', 4000);
            setTimeout(() => advance(true), 400);
        } else {
            showToast('❌ No se pudo reproducir "' + song.name + '".', 5000);
        }
    }

    function updateUI() {
        const song = state.songs.find(s => s.id === state.currentId);
        if (song) {
            $('mini-player').classList.toggle('hidden', panel.classList.contains('expanded'));
            $('mini-title').textContent = song.name;
            $('mini-artist').textContent = song.artist;
            $('track-title').textContent = song.name;
            $('track-artist').textContent = song.artist;

            const coverKey = song.id + '|' + (song.cover ? 1 : 0);
            if (shownCoverFor !== coverKey) {
                shownCoverFor = coverKey;
                const cu = getCoverUrl(song);
                $('mini-cover').innerHTML = cu ? `<img src="${cu}" alt="">` : '';
                $('cover-large').innerHTML = cu ? `<img src="${cu}" alt="">` : '';
            }

            $('btn-play').innerHTML = state.isPlaying ? svgPause : svgPlay;
            $('mini-play').innerHTML = state.isPlaying ? svgPause : svgPlay;
            updateMediaSession(song);
        }
    }

    // Controles en la pantalla de bloqueo / centro de control / auriculares
    function registerMediaHandlers() {
        if (!('mediaSession' in navigator)) return;
        const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
        set('play', () => { audio.play().catch(() => {}); });
        set('pause', () => { audio.pause(); });
        set('previoustrack', () => prevSong());
        set('nexttrack', () => nextSong(1));
        // Se desactivan "adelantar/retroceder 10 s" para que el sistema muestre cambiar de canción
        set('seekbackward', null);
        set('seekforward', null);
        set('seekto', (d) => {
            if (d && typeof d.seekTime === 'number' && isFinite(audio.duration)) audio.currentTime = d.seekTime;
        });
    }
    registerMediaHandlers();

    function updateMediaSession(song) {
        if (!('mediaSession' in navigator)) return;
        try {
            const art = getCoverUrl(song);
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.name, artist: song.artist, album: 'Music316',
                artwork: art ? [{ src: art, sizes: '320x320', type: song.coverType || 'image/jpeg' }] : []
            });
            navigator.mediaSession.playbackState = state.isPlaying ? 'playing' : 'paused';
        } catch (e) {}
    }

    function updatePositionState() {
        if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
        if (!isFinite(audio.duration) || audio.duration <= 0) return;
        try {
            navigator.mediaSession.setPositionState({
                duration: audio.duration,
                playbackRate: audio.playbackRate || 1,
                position: Math.min(audio.currentTime, audio.duration)
            });
        } catch (e) {}
    }
    ['loadedmetadata', 'play', 'pause', 'seeked'].forEach(ev => audio.addEventListener(ev, updatePositionState));

    function togglePlay() {
        if (!state.currentId) { if (state.songs.length > 0) nextSong(1); return; }
        if (audio.paused) { audio.play().catch(() => {}); state.isPlaying = true; } else { audio.pause(); state.isPlaying = false; }
        updateUI();
    }

    $('btn-play').addEventListener('click', togglePlay);
    $('mini-play').addEventListener('click', togglePlay);

    $('btn-next').addEventListener('click', () => nextSong(1));
    $('btn-prev').addEventListener('click', () => prevSong());

    function prevSong() {
        if (audio.currentTime > 3) { audio.currentTime = 0; return; }
        while (state.history.length) {
            const id = state.history.pop();
            if (id !== state.currentId && state.songs.some(s => s.id === id)) { playSong(id, { noHistory: true }); return; }
        }
        // Sin historial: en aleatorio (o con una sola canción) se reinicia la actual; si no, la anterior de la lista
        if (state.shuffle || state.songs.length < 2) { audio.currentTime = 0; return; }
        const i = state.songs.findIndex(s => s.id === state.currentId);
        playSong(state.songs[(i <= 0 ? state.songs.length : i) - 1].id, { noHistory: true });
    }

    // Vuelta aleatoria: todas las canciones de la biblioteca mezcladas, sin repetir hasta que suenen todas
    function buildBag(excludeId) {
        const ids = state.songs.map(x => x.id).filter(id => id !== excludeId);
        for (let i = ids.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [ids[i], ids[j]] = [ids[j], ids[i]];
        }
        return ids;
    }

    // Decide cuál suena después, sin cambiar nada. SIEMPRE usa toda la biblioteca: el texto del buscador
    // solo filtra lo que ves en pantalla, nunca lo que suena.
    // auto = true cuando la canción terminó sola (con "repetir: apagado" se detiene al final de la lista)
    function planNext(auto) {
        // 1) Primero lo que esté en Mi Lista, en el orden en que lo añadiste
        const q = state.playlist.find(id => state.songs.some(x => x.id === id));
        if (q) return { id: q };

        const pool = state.songs;
        if (pool.length === 0) return null;

        if (state.shuffle) {
            const valid = new Set(pool.map(x => x.id));
            if (shuffleBag === null) shuffleBag = buildBag(state.currentId);   // vuelta nueva
            shuffleBag = shuffleBag.filter(id => valid.has(id) && id !== state.currentId);
            if (shuffleBag.length === 0) {
                // terminó la vuelta: con repetir apagado se detiene, si no, empieza otra
                if (auto && state.repeat === 'off' && state.currentId) return { stop: true };
                shuffleBag = buildBag(state.currentId);
                if (shuffleBag.length === 0) shuffleBag = pool.map(x => x.id);   // solo hay una canción
            }
            return { id: shuffleBag[0] };
        }

        // Orden normal ("por filas")
        const idx = pool.findIndex(x => x.id === state.currentId);
        if (idx === -1) return { id: pool[0].id };
        const n = idx + 1;
        if (auto && state.repeat === 'off' && n >= pool.length) return { stop: true };
        return { id: pool[n % pool.length].id };
    }

    function advance(auto) {
        const plan = planNext(auto);
        if (!plan) return;
        if (plan.stop) { endOfQueue(); return; }
        playSong(plan.id);
    }

    function nextSong(dir = 1, auto = false) {
        if (dir < 0) { prevSong(); return; }
        advance(auto);
    }

    // Se acabó la lista y "repetir" está apagado: se queda en la última canción, en pausa y al inicio
    function endOfQueue() {
        audio.pause();
        try { audio.currentTime = 0; } catch (e) {}
        state.isPlaying = false;
        updateUI();
    }

    // Botones de aleatorio y repetir
    const svgRepeat = '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
    const svgRepeatOne = '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>';

    function updateModeButtons() {
        $('btn-shuffle').classList.toggle('active', state.shuffle);
        $('btn-repeat').classList.toggle('active', state.repeat !== 'off');
        $('btn-repeat').innerHTML = state.repeat === 'one' ? svgRepeatOne : svgRepeat;
        $('btn-shuffle').setAttribute('aria-pressed', state.shuffle);
    }

    $('btn-shuffle').addEventListener('click', () => {
        state.shuffle = !state.shuffle;
        shuffleBag = null;
        saveModes();
        updateModeButtons();
        schedulePreload();
        showToast(state.shuffle ? '🔀 Aleatorio activado' : '➡️ Orden normal');
    });

    // Repetir: apagado → toda la lista → una canción
    $('btn-repeat').addEventListener('click', () => {
        state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
        saveModes();
        updateModeButtons();
        schedulePreload();
        showToast(state.repeat === 'off' ? 'Repetir: apagado' : state.repeat === 'all' ? '🔁 Repetir toda la lista' : '🔂 Repetir esta canción');
    });
    updateModeButtons();

    // Barra de progreso (siempre en escala 0–100)
    let seeking = false;
    const seekBar = $('seek-bar');
    seekBar.addEventListener('input', (e) => {
        seeking = true;
        if (audio.duration) {
            const t = (e.target.value / 100) * audio.duration;
            $('current-time').textContent = formatTime(t);
        }
    });
    seekBar.addEventListener('change', (e) => {
        if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
        seeking = false;
    });

    audio.addEventListener('timeupdate', () => {
        if (!audio.duration || seeking) return;
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        $('current-time').textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', () => {
        if (audio.src === SILENT) return;
        $('duration').textContent = formatTime(audio.duration);
        seekBar.value = 0;
        $('current-time').textContent = '0:00';
    });
    audio.addEventListener('ended', () => {
        if (state.repeat === 'one' && state.currentId) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } else {
            advance(true);   // el cambio es inmediato si la siguiente ya estaba cargada
        }
    });
    // Si el archivo se daña o no se puede decodificar a mitad de camino, se salta a la siguiente
    audio.addEventListener('error', () => {
        if (!state.currentId || !audio.getAttribute('src') || audio.src === SILENT) return;
        const song = state.songs.find(x => x.id === state.currentId);
        if (song) handlePlayError({ name: 'MediaError' }, song);
    });
    audio.addEventListener('play', () => { if (state.currentId && audio.src !== SILENT) { state.isPlaying = true; updateUI(); } });
    audio.addEventListener('pause', () => { if (state.currentId && audio.src !== SILENT) { state.isPlaying = false; updateUI(); } });

    /* ============ Panel deslizable ============ */
    const panel = $('player-panel');
    const mini = $('mini-player');
    const PEEK = 170;   // alto visible del panel cerrado (igual que en el CSS)
    const isExpanded = () => panel.classList.contains('expanded');

    function expandPanel() {
        panel.style.transform = '';
        panel.classList.add('expanded');
        document.body.classList.add('panel-expanded');
        mini.classList.add('hidden');
    }

    function collapsePanel() {
        panel.style.transform = '';
        panel.classList.remove('expanded');
        document.body.classList.remove('panel-expanded');
        if (state.currentId) mini.classList.remove('hidden');
    }

    $('btn-collapse').addEventListener('click', () => { if (isExpanded()) collapsePanel(); else expandPanel(); });
    mini.addEventListener('click', (e) => { if (!e.target.closest('#mini-play')) expandPanel(); });

    // Arrastre: el panel sigue al dedo (abierto o cerrado) y al soltar termina el movimiento solo
    let drag = null, rafId = 0, pendingY = 0;
    const collapsedY = () => Math.max(0, panel.offsetHeight - PEEK);

    function applyDrag() {
        rafId = 0;
        if (drag) panel.style.transform = `translate3d(0, ${pendingY}px, 0)`;
    }

    panel.addEventListener('touchstart', (e) => {
        if (e.target.closest('button')) return;   // los botones funcionan con su propio toque
        const collapsed = !isExpanded();
        // Cerrado: se arrastra desde cualquier parte visible. Abierto: solo desde la zona de arriba.
        if (!collapsed && !e.target.closest('#drag-area')) return;
        const t = e.touches[0];
        drag = { startY: t.clientY, lastY: t.clientY, lastT: e.timeStamp, v: 0, collapsed, base: collapsed ? collapsedY() : 0 };
        pendingY = drag.base;
        panel.classList.add('dragging');
    }, { passive: true });

    panel.addEventListener('touchmove', (e) => {
        if (!drag) return;
        const y = e.touches[0].clientY;
        const dt = e.timeStamp - drag.lastT;
        if (dt > 0) drag.v = (y - drag.lastY) / dt;   // px/ms (negativo = hacia arriba)
        drag.lastY = y;
        drag.lastT = e.timeStamp;
        pendingY = Math.max(0, Math.min(drag.base + (y - drag.startY), collapsedY()));
        if (!rafId) rafId = requestAnimationFrame(applyDrag);
    }, { passive: true });

    function endDrag() {
        if (!drag) return;
        const d = drag;
        drag = null;
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        panel.classList.remove('dragging');
        const dy = d.lastY - d.startY;
        if (d.collapsed) {
            // toque, deslizar hacia arriba o un empujón rápido: se abre
            if (dy < -40 || d.v < -0.5 || Math.abs(dy) < 10) expandPanel(); else collapsePanel();
        } else {
            if (dy > 100 || d.v > 0.6) collapsePanel(); else expandPanel();
        }
    }
    panel.addEventListener('touchend', endDrag);
    panel.addEventListener('touchcancel', endDrag);

    window.resetDB = function() {
        if (confirm('¿Seguro que quieres borrar todas las canciones guardadas?')) {
            try { localStorage.removeItem(PLAYLIST_KEY); } catch (e) {}
            if (db) db.close();
            const req = indexedDB.deleteDatabase(DB_NAME);
            req.onsuccess = req.onerror = req.onblocked = () => location.reload();
        }
    };

    /* ============ Barra superior: aparece al subir un poco ============ */
    (function () {
        const bar = $('sticky-bar');
        const head = document.querySelector('header');
        const search = $('search-input');
        let barTop = 0, lastY = 0, run = 0, ticking = false;
        const measure = () => { barTop = head.offsetHeight; };
        const setHidden = (h) => bar.classList.toggle('hide', h);

        function onScroll() {
            ticking = false;
            const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
            const y = Math.max(0, Math.min(window.scrollY, maxY));   // ignora el rebote de iOS arriba y abajo
            const dy = y - lastY;
            lastY = y;
            // Arriba del todo, o escribiendo en el buscador: siempre visible
            if (y <= barTop + 4 || document.activeElement === search) { setHidden(false); run = 0; return; }
            if (dy === 0) return;
            if ((dy > 0) !== (run > 0)) run = 0;   // cambió el sentido: se cuenta de nuevo
            run += dy;
            if (run > 10) setHidden(true);          // bajando: se esconde
            else if (run < -8) setHidden(false);    // subiendo un poquito: aparece
        }
        window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
        window.addEventListener('resize', measure);
        window.addEventListener('orientationchange', measure);
        window.addEventListener('load', measure);
        measure();
    })();

    /* ============ Inicio ============ */
    (async function init() {
        try {
            await initDB();
            dbOk = true;
            // Pide que el navegador no borre los datos de la app
            if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
            state.songs = (await getSongsFromDB()).sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
            // Limpia de la lista las canciones que ya no existen
            const ids = new Set(state.songs.map(s => s.id));
            state.playlist = state.playlist.filter(id => ids.has(id));
            savePlaylist();
        } catch (err) {
            console.error('No se pudo abrir la base de datos:', err);
            dbOk = false;
            dbError = errName(err);
            showToast('⚠️ No se puede guardar en este navegador (' + dbError + '). Si usas una pestaña privada, ábrela en una normal.', 8000);
        }

        const msg = $('empty-msg');
        if (msg) msg.style.display = 'none';
        renderSongs();
        backfillCovers();   // en segundo plano: busca las imágenes de las canciones ya guardadas
    })();
</script>
</body>
</html>
