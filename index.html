    // Grupos de canciones que son la misma: mismo archivo, o mismo título y artista.
    // Sin etiquetas, el mismo nombre de archivo cuenta solo si pesan casi igual (±15 %).
    function findDuplicateGroups(songs) {
        const parent = new Map(songs.map(x => [x.id, x.id]));
        const find = (x) => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
        const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent.set(ra, rb); };
        const byKey = new Map();
        const add = (k, x) => { const arr = byKey.get(k); if (arr) arr.push(x); else byKey.set(k, [x]); };
        for (const x of songs) {
            if (x.hash) add('h:' + x.hash, x);
            if (x.title && x.artist && x.artist !== 'Archivo local') add('t:' + norm(x.title) + '|' + norm(firstArtist(x.artist)), x);
            else add('f:' + norm(stripCopy(x.name)), x);
        }
        for (const [k, arr] of byKey) {
            if (arr.length < 2) continue;
            if (k[0] === 'f') {
                arr.sort((a, b) => a.size - b.size);
                for (let i = 1; i < arr.length; i++) if (arr[i].size <= arr[i - 1].size * 1.15) union(arr[i].id, arr[i - 1].id);
            } else {
                for (let i = 1; i < arr.length; i++) union(arr[i].id, arr[0].id);
            }
        }
        const groups = new Map();
        for (const x of songs) {
            const r = find(x.id);
            if (!groups.has(r)) groups.set(r, []);
            groups.get(r).push(x);
        }
        return [...groups.values()].filter(g => g.length > 1);
    }

    // Quita las repetidas ya guardadas. Se queda la de mayor tamaño (mejor calidad) y, si empatan, la más antigua.
    // Lo que apuntaba a la repetida (playlists, Mi Lista) pasa a apuntar a la que se queda.
    async function cleanDuplicates() {
        if (!dbOk || state.currentId) return 0;
        let removed = 0;
        for (const g of findDuplicateGroups(state.songs)) {
            g.sort((a, b) => (b.size - a.size) || ((a.addedAt || 0) - (b.addedAt || 0)));
            const keep = g[0];
            for (const dup of g.slice(1)) {
                if (dup.id === state.currentId) continue;
                try { await removeSongFromDB(dup.id); } catch (e) { continue; }
                const swap = (arr) => { const out = []; for (const id of arr) { const v = id === dup.id ? keep.id : id; if (!out.includes(v)) out.push(v); } return out; };
                state.playlist = swap(state.playlist);
                state.lists.forEach(l => { l.songs = swap(l.songs); });
                state.history = state.history.filter(x => x !== dup.id);
                if (!keep.cover && dup.cover) {
                    keep.cover = dup.cover; keep.coverType = dup.coverType;
                    try { await updateSongMeta(keep); } catch (e) {}
                }
                state.songs = state.songs.filter(x => x !== dup);
                dropCoverUrl(dup.id);
                delete memFiles[dup.id];
                removed++;
            }
        }
        if (removed) { savePlaylist(); savePlaylists(); }
        return removed;
    }

    // Canciones guardadas antes de esta versión: se lee su imagen, título/artista y huella una sola vez, en segundo plano
    async function backfillCovers() {
        if (!dbOk) return;
        const todo = state.songs.filter(x => !x.coverChecked || !x.tagsChecked || !x.hash);
        if (!todo.length) return;
        let covers = 0, tagged = 0;
        for (const song of todo) {
            try {
                const buf = await getFileFromDB(song.id);
                if (buf) {
                    if (!song.coverChecked) {
                        const cv = await coverFromBuffer(buf);
                        if (cv) { song.cover = cv.data; song.coverType = cv.type; covers++; }
                    }
                    if (!song.tagsChecked) {
                        const t = rawTags(buf);
                        if (t) { applyTags(song, t); tagged++; }
                    }
                    if (!song.hash) song.hash = await hashBuffer(buf);
                }
                song.coverChecked = true;
                song.tagsChecked = true;
                if (!state.songs.includes(song)) continue;   // la borraste mientras tanto
                await updateSongMeta(song);
                if (song.cover) refreshCoverInDom(song.id);
            } catch (e) { /* se intenta con la siguiente */ }
            await new Promise(r => setTimeout(r, 20));
        }
        if (tagged || covers) {
            renderSongs();   // ahora con los títulos y artistas
            showToast('🎵 Se leyeron los datos de ' + Math.max(tagged, covers) + ' canciones (nombre y artista)', 4000);
        }
    }

    /* ============ Importar canciones ============ */
    $('file-input').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (files.length === 0) return;

        $('empty-msg') && ($('empty-msg').style.display = 'none');
        showToast('⏳ Guardando ' + files.length + ' archivo(s)...', 6000);

        let added = 0, temp = 0, skipped = 0, failed = 0, lastErr = '';

        // Uno por uno para no saturar la memoria del teléfono
        for (const file of files) {
            if (!file.size || !isAudioFile(file)) { failed++; continue; }

            const name = file.name.replace(/\.[^.]+$/, '');
            if (state.songs.some(s => s.name === name && s.size === file.size)) { skipped++; continue; }

            const meta = {
                id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
                name,
                artist: 'Archivo local',
                type: guessMime(file),
                size: file.size,
                addedAt: Date.now()
            };

            let buffer;
            try {
                buffer = await file.arrayBuffer();
            } catch (err) {
                console.error('No se pudo leer el archivo:', err);
                failed++; lastErr = errName(err);
                continue;
            }

            // Datos que trae el archivo: título, artista, álbum y pista
            try { applyTags(meta, rawTags(buffer)); } catch (err) {}
            meta.tagsChecked = true;
            meta.hash = await hashBuffer(buffer);

            // Repetida: la misma canción ya está guardada (mismo archivo, o mismo título y artista)
            if (findDuplicateGroups(state.songs.concat([meta])).some(g => g.includes(meta))) { skipped++; continue; }

            // Imagen incrustada en el archivo (si tiene)
            try {
                const cv = await coverFromBuffer(buffer);
                if (cv) { meta.cover = cv.data; meta.coverType = cv.type; }
            } catch (err) {}
            meta.coverChecked = true;

            let saved = false;
            if (dbOk) {
                try {
                    await saveSongToDB(meta, buffer);
                    // Verifica que de verdad quedó guardada leyéndola de vuelta
                    const check = await getFileFromDB(meta.id);
                    if (!check || check.byteLength !== buffer.byteLength) throw new Error('Verificación fallida');
                    saved = true;
                } catch (err) {
                    console.error('Error guardando en la base de datos:', err);
                    lastErr = errName(err);
                    try { await removeSongFromDB(meta.id); } catch (x) {}
                }
            } else {
                lastErr = dbError;
            }

            if (saved) {
                state.songs.push(meta);
                if (shuffleBag) shuffleBag.push(meta.id);
                added++;
            } else {
                // Solo disponible mientras la app esté abierta
                memFiles[meta.id] = new Blob([buffer], { type: meta.type });
                state.songs.push(meta);
                if (shuffleBag) shuffleBag.push(meta.id);
                temp++;
            }
        }

        renderSongs();

        // Pide al navegador que no borre las canciones guardadas
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

        let msg = '';
        if (added) msg += '✅ ' + added + ' guardada(s)';
        if (skipped) msg += (msg ? ' · ' : '') + skipped + ' repetida(s)';
        if (failed) msg += (msg ? ' · ' : '') + failed + ' con error';
        if (temp) {
            const info = await storageInfo();
            msg += (msg ? ' · ' : '') + '⚠️ ' + temp + ' NO se pudieron guardar (' + lastErr + ') y se perderán al cerrar la app.' + (info ? ' Espacio: ' + info + '.' : '');
            showToast(msg, 12000);
        } else {
            showToast(msg || '✅ Listo', 3500);
        }
    });

    /* ============ Buscador ============ */
    let searchQuery = '';
    const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    function applySearch(list) {
        const q = norm(searchQuery).trim();
        return q ? list.filter(s => norm([s.name, s.title, s.artist, s.album].filter(Boolean).join(' ')).includes(q)) : list;
    }

    /* ----- Artistas ----- */
    // "Bad Bunny, Anuel AA" o "Bad Bunny feat. Anuel AA" -> los dos artistas (la canción aparece en cada uno)
    function artistNamesOf(s) {
        const seen = new Set(), out = [];
        for (const n of String(s.artist || '').split(/\s*(?:,|;|&|\/)\s*|\s+(?:feat\.?|ft\.?|featuring|con|x)\s+/i)) {
            const name = n.trim(), k = norm(name);
            if (!k || k === 'archivo local' || seen.has(k)) continue;
            seen.add(k); out.push(name);
        }
        return out;
    }
    const artistKeysOf = (s) => artistNamesOf(s).map(norm);
    function firstArtist(a) { return artistNamesOf({ artist: a })[0] || ''; }
    const titleSort = (a, b) => String(songTitle(a)).localeCompare(songTitle(b), 'es', { sensitivity: 'base', numeric: true });
    function artistSongs(key) { return state.songs.filter(s => artistKeysOf(s).includes(key)).sort(titleSort); }
    function buildArtists() {
        const map = new Map();
        for (const s of state.songs) {
            const names = artistNamesOf(s);
            const entries = names.length ? names.map(n => [norm(n), n]) : [['', 'Sin artista']];
            for (const [key, name] of entries) {
                let a = map.get(key);
                if (!a) { a = { key, name, songs: [] }; map.set(key, a); }
                a.songs.push(s);
            }
        }
        const list = [...map.values()];
        for (const a of list) { a.songs.sort(titleSort); a.cover = a.songs.find(x => x.cover) || null; }
        list.sort((x, y) => (x.key ? 0 : 1) - (y.key ? 0 : 1) || x.name.localeCompare(y.name, 'es', { sensitivity: 'base', numeric: true }));
        return list;
    }

    // Biblioteca completa, en el orden en que se añadieron las canciones
    function getLibrarySongs() { return applySearch(state.songs); }

    // "Todas" = biblioteca. "Mi Lista" = cola de continuación, en el orden en que las fuiste añadiendo
    function getDisplaySongs() {
        if (state.currentTab === 'artists') return state.artistKey === null ? [] : applySearch(artistSongs(state.artistKey));
        if (state.currentTab === 'lists') {
            const pl = state.lists.find(l => l.id === state.listId);
            return pl ? applySearch(listSongs(pl)) : [];
        }
        if (state.currentTab === 'queue') {
            const byId = new Map(state.songs.map(s => [s.id, s]));
            return applySearch(state.playlist.map(id => byId.get(id)).filter(Boolean));
        }
        return getLibrarySongs();
    }

    const searchInput = $('search-input');
    const searchClear = $('search-clear');
    searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        searchClear.style.display = searchQuery ? 'flex' : 'none';
        renderSongs();
    });
    searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        searchClear.style.display = 'none';
        renderSongs();
        searchInput.focus();
    });

    /* ============ Pestañas y lista ============ */
    $('tab-all').addEventListener('click', () => { state.currentTab = 'all'; updateTabs(); renderSongs(); });
    $('tab-artists').addEventListener('click', () => {
        if (state.currentTab === 'artists') state.artistKey = null;   // tocar "Artistas" estando dentro de uno vuelve a la lista
        state.currentTab = 'artists'; updateTabs(); renderSongs();
    });
    $('tab-lists').addEventListener('click', () => {
        if (state.currentTab === 'lists') state.listId = null;        // igual con "Playlists"
        state.currentTab = 'lists'; updateTabs(); renderSongs();
    });
    $('tab-queue').addEventListener('click', () => { state.currentTab = 'queue'; updateTabs(); renderSongs(); });

    function updateTabs() {
        for (const [id, name] of [['tab-all', 'all'], ['tab-artists', 'artists'], ['tab-lists', 'lists'], ['tab-queue', 'queue']]) {
            $(id).classList.toggle('active', state.currentTab === name);
        }
    }

    function formatTime(sec) { if (!isFinite(sec)) return '0:00'; const m = Math.floor(sec / 60); const s = Math.floor(sec % 60).toString().padStart(2, '0'); return `${m}:${s}`; }

    const songListEl = $('song-list');

    const DEL_W = 96;
    const SNAP = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
    const svgTrash = '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
    let openRow = null;   // fila que tiene abierto el botón rojo

    const svgBack = '<svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>';
    const svgChevron = '<svg class="row-chev" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>';
    const svgPlus = '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>';
    const svgEdit = '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
    const svgCamera = '<svg viewBox="0 0 24 24" style="width:34px;height:34px"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>';

    const emptyHtml = (kind) => `<div class="empty-state">${
        kind === 'queue' ? 'Tu lista está vacía.<br>Desliza una canción a la derecha para añadirla.<br>Las canciones de aquí suenan a continuación y se quitan al escucharlas.'
        : kind === 'list' ? 'Esta playlist está vacía.<br>Toca "Añadir" para agregar canciones.'
        : 'No hay canciones guardadas.<br><br><button class="reset-btn" onclick="resetDB()">Borrar Base de Datos</button>'
    }</div>`;
    const noResultsHtml = () => `<div class="empty-state">Sin resultados para "${escapeHtml(searchQuery.trim())}"</div>`;
    const countText = (n) => n + (n === 1 ? ' canción' : ' canciones');

    // Qué lista está sonando según desde dónde tocaste: "Todas" = toda la biblioteca, un artista o una playlist = esa lista
    function viewContext() {
        if (state.currentTab === 'artists') return { type: 'artist', key: state.artistKey };
        if (state.currentTab === 'lists') return { type: 'list', id: state.listId };
        if (state.currentTab === 'all') return null;
        return undefined;   // Mi Lista no cambia nada
    }

    // Reproducir una lista completa (con aleatorio activado empieza en una al azar)
    function playWholeList(songs, context) {
        if (!songs.length) { showToast('No hay canciones para reproducir'); return; }
        const first = state.shuffle ? songs[Math.floor(Math.random() * songs.length)] : songs[0];
        playSong(first.id, { expand: true, context });
    }

    function listCoverHtml(pl) {
        if (pl.photo) return `<img src="${pl.photo}" alt="" draggable="false">`;
        const s = listSongs(pl).find(x => x.cover);
        return s ? coverImg(s) : svgMusic;
    }

    // Cabecera de un artista o de una playlist: volver, portada, nombre y botones
    function detailHeadEl({ back, onBack, title, subtitle, coverHtml, actions }) {
        const el = document.createElement('div');
        el.className = 'detail-head';
        el.innerHTML = `
            <button class="detail-back" aria-label="Volver">${svgBack}<span></span></button>
            <div class="detail-top">
                <div class="detail-cover">${coverHtml || svgMusic}</div>
                <div class="detail-meta"><div class="song-title"></div><div class="song-artist"></div></div>
            </div>
            <div class="detail-actions"></div>`;
        el.querySelector('.detail-back span').textContent = back;
        el.querySelector('.song-title').textContent = title;
        el.querySelector('.song-artist').textContent = subtitle;
        el.querySelector('.detail-back').addEventListener('click', () => { onBack(); window.scrollTo(0, 0); });
        const box = el.querySelector('.detail-actions');
        for (const a of actions) {
            const b = document.createElement('button');
            b.className = 'head-btn' + (a.primary ? ' primary' : '');
            b.innerHTML = a.icon + '<span></span>';
            b.querySelector('span').textContent = a.label;
            b.addEventListener('click', a.onClick);
            box.appendChild(b);
        }
        return el;
    }

    function artistHeadEl(ar) {
        return detailHeadEl({
            back: 'Artistas', onBack: () => { state.artistKey = null; renderSongs(); },
            title: ar.name, subtitle: countText(ar.songs.length), coverHtml: ar.cover ? coverImg(ar.cover) : '',
            actions: [{ label: 'Reproducir', icon: svgPlay, primary: true, onClick: () => playWholeList(ar.songs, { type: 'artist', key: ar.key }) }]
        });
    }

    function listHeadEl(pl) {
        const songs = listSongs(pl);
        return detailHeadEl({
            back: 'Playlists', onBack: () => { state.listId = null; renderSongs(); },
            title: pl.name, subtitle: countText(songs.length), coverHtml: listCoverHtml(pl),
            actions: [
                { label: 'Reproducir', icon: svgPlay, primary: true, onClick: () => playWholeList(songs, { type: 'list', id: pl.id }) },
                { label: 'Añadir', icon: svgPlus, onClick: () => openSongPicker(pl) },
                { label: 'Editar', icon: svgEdit, onClick: () => openListEditor(pl) }
            ]
        });
    }

    function renderArtistList() {
        songListEl.innerHTML = '';
        let artists = buildArtists();
        const q = norm(searchQuery).trim();
        if (q) artists = artists.filter(a => norm(a.name + ' ' + a.songs.map(s => songTitle(s)).join(' ')).includes(q));
        if (artists.length === 0) { songListEl.innerHTML = q ? noResultsHtml() : emptyHtml('library'); return; }
        for (const a of artists) {
            const row = document.createElement('div');
            row.className = 'list-row' + (a.songs.some(s => s.id === state.currentId) ? ' active' : '');
            const cu = a.cover ? getCoverUrl(a.cover) : '';
            row.innerHTML = `
                <div class="song-cover">${cu ? `<img src="${cu}" alt="" draggable="false">` : svgMusic}</div>
                <div class="song-meta"><div class="song-title"></div><div class="song-artist"></div></div>${svgChevron}`;
            row.querySelector('.song-title').textContent = a.name;
            row.querySelector('.song-artist').textContent = countText(a.songs.length);
            row.addEventListener('click', () => { state.artistKey = a.key; renderSongs(); window.scrollTo(0, 0); });
            songListEl.appendChild(row);
        }
    }

    function renderListsOverview() {
        songListEl.innerHTML = '';
        const q = norm(searchQuery).trim();
        if (!q) {
            const nr = document.createElement('div');
            nr.className = 'list-row';
            nr.innerHTML = `<div class="song-cover new-cover">${svgPlus}</div>
                <div class="song-meta"><div class="song-title">Nueva playlist</div><div class="song-artist">Ponle nombre y foto</div></div>${svgChevron}`;
            nr.addEventListener('click', () => openListEditor(null, (pl) => { state.listId = pl.id; renderSongs(); window.scrollTo(0, 0); }));
            songListEl.appendChild(nr);
        }
        const lists = q ? state.lists.filter(l => norm(l.name).includes(q)) : state.lists;
        if (q && lists.length === 0) { songListEl.innerHTML = noResultsHtml(); return; }
        for (const pl of lists) {
            const row = document.createElement('div');
            row.className = 'list-row';
            row.innerHTML = `
                <div class="song-cover">${listCoverHtml(pl)}</div>
                <div class="song-meta"><div class="song-title"></div><div class="song-artist"></div></div>${svgChevron}`;
            row.querySelector('.song-title').textContent = pl.name;
            row.querySelector('.song-artist').textContent = countText(listSongs(pl).length);
            row.addEventListener('click', () => { state.listId = pl.id; renderSongs(); window.scrollTo(0, 0); });
            songListEl.appendChild(row);
        }
    }

    function renderSongs() {
        openRow = null;
        const tab = state.currentTab;
        if (tab === 'artists' && state.artistKey === null) { renderArtistList(); return; }
        if (tab === 'lists' && state.listId === null) { renderListsOverview(); return; }
        songListEl.innerHTML = '';
        if (tab === 'artists') {
            const ar = buildArtists().find(a => a.key === state.artistKey);
            if (!ar) { state.artistKey = null; renderArtistList(); return; }   // el artista se quedó sin canciones
            songListEl.appendChild(artistHeadEl(ar));
        } else if (tab === 'lists') {
            const pl = state.lists.find(l => l.id === state.listId);
            if (!pl) { state.listId = null; renderListsOverview(); return; }
            songListEl.appendChild(listHeadEl(pl));
        }
        const displaySongs = getDisplaySongs();
        const inQueue = tab === 'queue';
        const inList = tab === 'lists';

        if (displaySongs.length === 0) {
            songListEl.insertAdjacentHTML('beforeend', searchQuery.trim() ? noResultsHtml() : emptyHtml(inQueue ? 'queue' : inList ? 'list' : 'library'));
            return;
        }

        displaySongs.forEach(song => {
            const wrapper = document.createElement('div');
            wrapper.className = 'song-wrapper';
            wrapper.innerHTML = `
                <div class="swipe-bg">
                    <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Añadir a Mi Lista
                </div>
                <div class="swipe-del">${svgTrash}${(inQueue || inList) ? 'Quitar' : 'Borrar'}</div>
                <div class="song-content ${song.id === state.currentId ? 'active' : ''}" data-id="${song.id}">
                    <div class="song-cover">${coverImg(song) || svgMusic}</div>
                    <div class="song-meta">
                        <div class="song-title">${escapeHtml(songTitle(song))}</div>
                        <div class="song-artist">${escapeHtml(song.artist)}</div>
                    </div>
                </div>`;

            const content = wrapper.querySelector('.song-content');
            const delEl = wrapper.querySelector('.swipe-del');
            let startX = 0, startY = 0, dx = 0, isDragging = false, lastTouch = 0, isOpen = false, pressTimer = 0, pressed = false;

            const row = {
                close() {
                    isOpen = false;
                    content.style.transition = SNAP;
                    content.style.transform = 'translateX(0)';
                    if (openRow === row) openRow = null;
                }
            };
            const openIt = () => {
                isOpen = true;
                openRow = row;
                content.style.transition = SNAP;
                content.style.transform = `translateX(${-DEL_W}px)`;
            };

            content.addEventListener('touchstart', (e) => {
                if (openRow && openRow !== row) openRow.close();   // solo una fila abierta a la vez
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dx = 0;
                isDragging = true;
                content.style.transition = 'none';
                pressed = false;
                clearTimeout(pressTimer);
                pressTimer = setTimeout(() => {   // dedo quieto medio segundo: menú de la canción
                    if (!isDragging || isOpen || Math.abs(dx) > 8) return;
                    pressed = true;
                    if (navigator.vibrate) navigator.vibrate(30);
                    openSongActions(song);
                }, 550);
            }, { passive: true });

            content.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const x = e.touches[0].clientX - startX;
                const y = e.touches[0].clientY - startY;
                if (Math.abs(x) > 8 || Math.abs(y) > 8) clearTimeout(pressTimer);   // se mueve: ya no es pulsación larga
                if (Math.abs(y) > Math.abs(x)) return;
                dx = x;
                const base = isOpen ? -DEL_W : 0;
                const t = Math.max(-DEL_W - 24, Math.min(base + dx, 160));
                content.style.transform = `translateX(${t}px)`;
            }, { passive: true });

            content.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                isDragging = false;
                lastTouch = Date.now();
                clearTimeout(pressTimer);
                if (pressed) { pressed = false; dx = 0; return; }   // fue una pulsación larga: no cuenta como toque
                const diffY = e.changedTouches[0].clientY - startY;
                const isTap = Math.abs(diffY) < 10 && Math.abs(dx) < 10;

                if (isTap) {
                    if (isOpen) row.close();
                    else { row.close(); playSong(song.id, { expand: true, context: viewContext() }); }
                } else if (!isOpen && dx < -50) {
                    openIt();                                  // deslizar a la izquierda: muestra "Borrar"
                } else if (!isOpen && dx > 80) {
                    addToPlaylist(song.id);                    // deslizar a la derecha: añadir a Mi Lista
                    row.close();
                } else if (isOpen && dx < 30) {
                    openIt();                                  // se queda abierta
                } else {
                    row.close();
                }
                dx = 0;
            });

            content.addEventListener('touchcancel', () => {
                clearTimeout(pressTimer);
                isDragging = false;
                if (isOpen) openIt(); else row.close();
                dx = 0;
            });

            // Para ordenador (con el dedo ya se maneja arriba)
            content.addEventListener('click', () => {
                if (Date.now() - lastTouch < 600) return;
                if (isOpen) row.close(); else playSong(song.id, { expand: true, context: viewContext() });
            });

            content.addEventListener('contextmenu', (e) => { e.preventDefault(); openSongActions(song); });   // clic derecho en ordenador

            delEl.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSong(song.id);
            });

            songListEl.appendChild(wrapper);
        });
    }

    // Detiene la reproducción y deja el reproductor vacío (se usa al borrar la canción que está sonando)
    function stopPlayback() {
        playToken++;
        dropPreload();
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
        state.currentId = null;
        state.isPlaying = false;
        shownCoverFor = null;
        $('mini-cover').innerHTML = '';
        $('cover-large').innerHTML = '';
        $('track-title').textContent = 'Ninguna canción';
        $('track-artist').textContent = '—';
        $('btn-play').innerHTML = svgPlay;
        $('mini-play').innerHTML = svgPlay;
        $('seek-bar').value = 0;
        $('current-time').textContent = '0:00';
        $('duration').textContent = '0:00';
        collapsePanel();
        mini.classList.add('hidden');
        if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = null; } catch (e) {} }
    }

    function removeFromQueue(id) {
        state.playlist = state.playlist.filter(x => x !== id);
        savePlaylist();
        renderSongs();
        schedulePreload();
        showToast('Quitada de Mi Lista');
    }

    function removeFromList(listId, id) {
        const pl = state.lists.find(l => l.id === listId);
        if (!pl) return;
        pl.songs = pl.songs.filter(x => x !== id);
        savePlaylists();
        renderSongs();
        schedulePreload();
        showToast('Quitada de "' + pl.name + '"');
    }

    // Deslizar a la izquierda: en Mi Lista y en una playlist solo la quita de ahí; en lo demás la borra de la app (con confirmación).
    // mode = 'library' fuerza el borrado de la app (menú de pulsación larga)
    async function deleteSong(id, mode = 'auto') {
        const song = state.songs.find(s => s.id === id);
        if (!song) return;

        if (mode === 'auto') {
            if (state.currentTab === 'queue') { removeFromQueue(id); return; }
            if (state.currentTab === 'lists' && state.listId !== null) { removeFromList(state.listId, id); return; }
        }

        if (!confirm('¿Borrar "' + songTitle(song) + '" de Music316?')) {
            if (openRow) openRow.close();
            return;
        }

        try {
            if (dbOk) await removeSongFromDB(id);
        } catch (err) {
            console.error('No se pudo borrar:', err);
            showToast('❌ No se pudo borrar (' + errName(err) + ')');
            return;
        }

        delete memFiles[id];
        state.songs = state.songs.filter(s => s.id !== id);
        state.playlist = state.playlist.filter(x => x !== id);
        state.lists.forEach(l => { l.songs = l.songs.filter(x => x !== id); });
        state.history = state.history.filter(x => x !== id);
        savePlaylist();
        savePlaylists();
        if (state.currentId === id) stopPlayback();
        renderSongs();
        dropCoverUrl(id);
        schedulePreload();
        showToast('🗑️ Canción borrada');
    }

    function addToPlaylist(id) {
        if (!state.playlist.includes(id)) {
            state.playlist.push(id);
            savePlaylist();
            schedulePreload();
            if (navigator.vibrate) navigator.vibrate(50);
            showToast('✅ Añadida a Mi Lista');
        } else {
            showToast('Ya está en Mi Lista');
        }
    }

    /* ============ Reproducción ============ */
    // Desbloquea el audio en iPhone con el primer toque (permite reproducir tras cargar de la base de datos)
    const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
    let audioUnlocked = false;
    function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        if (audio.src) return;
        audio.src = SILENT;
        const p = audio.play();
        if (p && p.then) p.then(() => { if (audio.src === SILENT) audio.pause(); }).catch(() => {});
    }
    document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
    document.addEventListener('click', unlockAudio, { once: true });

    let currentUrl = null;
    async function getSongUrl(song) {
        let blob = memFiles[song.id];
        if (!blob) {
            const data = await getFileFromDB(song.id);
            if (!data) throw new Error('Archivo no encontrado');
            blob = new Blob([data], { type: song.type || 'audio/mpeg' });
        }
        return URL.createObjectURL(blob);
    }

    let playToken = 0;
    let errorSkips = 0;        // canciones seguidas que no se pudieron reproducir
    let errHandledFor = -1;    // para no tratar dos veces el mismo error

    // La siguiente canción se deja cargada en memoria mientras suena la actual. Al terminar, el cambio es
    // inmediato (sin esperar a la base de datos): así el teléfono no corta la música entre canciones,
    // sobre todo con la pantalla bloqueada o la app en segundo plano.
    let preload = { id: null, url: null, token: 0 };
    let preloadTimer = 0;
    function dropPreload() {
        if (preload.url) { try { URL.revokeObjectURL(preload.url); } catch (e) {} }
        preload = { id: null, url: null, token: preload.token + 1 };
    }
    function takePreload(id) {
        if (preload.id === id && preload.url) {
            const url = preload.url;
            preload = { id: null, url: null, token: preload.token + 1 };
            return url;
        }
        return null;
    }
    function schedulePreload() {
        clearTimeout(preloadTimer);
        preloadTimer = setTimeout(refreshPreload, 300);
    }
    async function refreshPreload() {
        if (!state.currentId || state.repeat === 'one') { dropPreload(); return; }
        const plan = planNext(true);
        if (!plan || plan.stop || plan.id === state.currentId) { dropPreload(); return; }
        if (preload.id === plan.id && preload.url) return;
        dropPreload();
        const mine = preload.token;
        const song = state.songs.find(x => x.id === plan.id);
        if (!song) return;
        try {
            const url = await getSongUrl(song);
            if (mine !== preload.token) { URL.revokeObjectURL(url); return; }
            preload.id = plan.id;
            preload.url = url;
        } catch (e) {}
    }

    // Marca la canción como "la que suena": historial, vuelta aleatoria, salir de Mi Lista, resaltado
    function selectTrack(id, opts) {
        if (!opts.noHistory && state.currentId && state.currentId !== id) {
            state.history.push(state.currentId);
            if (state.history.length > 50) state.history.shift();
        }
        if (shuffleBag) shuffleBag = shuffleBag.filter(x => x !== id);

        // Si estaba en Mi Lista, sale de la lista en cuanto empieza a sonar
        const qi = state.playlist.indexOf(id);
        if (qi !== -1) { state.playlist.splice(qi, 1); savePlaylist(); }

        state.currentId = id;
        if (qi !== -1 && state.currentTab === 'queue') renderSongs();
        document.querySelectorAll('.song-content').forEach(el => {
            el.classList.toggle('active', el.dataset.id === id);
        });
    }

    async function playSong(id, opts = {}) {
        const song = state.songs.find(s => s.id === id);
        if (!song) return;

        const token = ++playToken;
        if (opts.context !== undefined) {   // tocaste una canción desde "Todas" (null) o desde un álbum
            const ck = (c) => c ? c.type + ':' + (c.key !== undefined ? c.key : c.id) : '';
            if (ck(opts.context) !== ck(state.context)) shuffleBag = null;   // cambió la lista: vuelta aleatoria nueva
            state.context = opts.context;
        }
        selectTrack(id, opts);
        // Si ya sonaba, sigue figurando como "sonando" durante el cambio (si no, la pantalla de bloqueo se queda en pausa)
        state.isPlaying = !audio.paused && !!audio.getAttribute('src') && audio.src !== SILENT;
        if (opts.expand) expandPanel();   // se abre ya, mientras la canción carga
        updateUI();

        try {
            // Si ya estaba cargada de antemano, se cambia en este mismo instante
            let url = takePreload(id);
            if (!url) url = await getSongUrl(song);
            if (token !== playToken) { URL.revokeObjectURL(url); return; }
            const oldUrl = currentUrl;
            currentUrl = url;
            audio.src = url;
            const started = audio.play();
            if (oldUrl) URL.revokeObjectURL(oldUrl);
            await started;
            if (token !== playToken) return;
            state.isPlaying = true;
            errorSkips = 0;
            updateUI();
            registerMediaHandlers();
            schedulePreload();
        } catch (err) {
            if (token !== playToken) return;
            handlePlayError(err, song);
        }
    }

    function handlePlayError(err, song) {
        if (errHandledFor === playToken) return;
        errHandledFor = playToken;
        console.error('Error al reproducir:', err);
        const n = err && err.name;
        if (n === 'AbortError') return;                       // pausaste justo al empezar
        state.isPlaying = false;
        updateUI();
        if (n === 'NotAllowedError') {                         // el teléfono bloqueó el inicio automático
            showToast('▶️ Toca play para continuar', 5000);
            return;
        }
        // Archivo dañado o formato que el teléfono no puede reproducir: se salta a la siguiente
        errorSkips++;
        if (state.songs.length > 1 && errorSkips <= Math.min(5, state.songs.length - 1)) {
            showToast('⚠️ No se pudo reproducir "' + songTitle(song) + '". Pasando a la siguiente…', 4000);
            setTimeout(() => advance(true), 400);
        } else {
            showToast('❌ No se pudo reproducir "' + songTitle(song) + '".', 5000);
        }
    }

    function updateUI() {
        const song = state.songs.find(s => s.id === state.currentId);
        if (song) {
            $('mini-player').classList.toggle('hidden', panel.classList.contains('expanded'));
            $('mini-title').textContent = songTitle(song);
            $('mini-artist').textContent = song.artist;
            $('track-title').textContent = songTitle(song);
            $('track-artist').textContent = song.artist;

            const coverKey = song.id + '|' + (song.cover ? 1 : 0);
            if (shownCoverFor !== coverKey) {
                shownCoverFor = coverKey;
                const cu = getCoverUrl(song);
                $('mini-cover').innerHTML = cu ? `<img src="${cu}" alt="">` : '';
                $('cover-large').innerHTML = cu ? `<img src="${cu}" alt="">` : '';
            }

            $('btn-play').innerHTML = state.isPlaying ? svgPause : svgPlay;
            $('mini-play').innerHTML = state.isPlaying ? svgPause : svgPlay;
            updateMediaSession(song);
        }
    }

    // Controles en la pantalla de bloqueo / centro de control / auriculares
    function registerMediaHandlers() {
        if (!('mediaSession' in navigator)) return;
        const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
        set('play', () => {
            // si el sistema había soltado el archivo (o la lista terminó), se vuelve a cargar la canción actual
            if (state.currentId && (!audio.getAttribute('src') || audio.src === SILENT || audio.error)) { playSong(state.currentId, { noHistory: true }); return; }
            if (!state.currentId) { if (state.songs.length) nextSong(1); return; }
            audio.play().catch(() => { setTimeout(() => audio.play().catch(() => {}), 300); });
        });
        set('pause', () => { audio.pause(); state.isPlaying = false; setMediaState(); });
        set('stop', () => { audio.pause(); state.isPlaying = false; setMediaState(); });
        set('previoustrack', () => prevSong());
        set('nexttrack', () => nextSong(1));
        // Se desactivan "adelantar/retroceder 10 s" para que el sistema muestre cambiar de canción
        set('seekbackward', null);
        set('seekforward', null);
        set('seekto', (d) => {
            if (d && typeof d.seekTime === 'number' && isFinite(audio.duration)) audio.currentTime = d.seekTime;
        });
    }
    registerMediaHandlers();

    let metaKey = '';
    function setMediaState() {
        if (!('mediaSession' in navigator)) return;
        try { navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing'; } catch (e) {}
    }
    function updateMediaSession(song) {
        if (!('mediaSession' in navigator)) return;
        try {
            const key = song.id + '|' + songTitle(song) + '|' + song.artist + '|' + (song.cover ? 1 : 0);
            if (key !== metaKey) {   // volver a crear los metadatos en cada pausa hace que iOS pierda los controles
                metaKey = key;
                const art = getCoverUrl(song);
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: songTitle(song), artist: song.artist, album: song.album || 'Music316',
                    artwork: art ? [{ src: art, sizes: '320x320', type: song.coverType || 'image/jpeg' }] : []
                });
            }
            navigator.mediaSession.playbackState = state.isPlaying ? 'playing' : 'paused';
        } catch (e) {}
    }

    function updatePositionState() {
        if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
        if (!isFinite(audio.duration) || audio.duration <= 0) return;
        try {
            navigator.mediaSession.setPositionState({
                duration: audio.duration,
                playbackRate: audio.playbackRate || 1,
                position: Math.min(audio.currentTime, audio.duration)
            });
        } catch (e) {}
    }
    ['loadedmetadata', 'play', 'pause', 'seeked'].forEach(ev => audio.addEventListener(ev, updatePositionState));

    function togglePlay() {
        if (!state.currentId) { if (state.songs.length > 0) nextSong(1); return; }
        if (audio.paused) { audio.play().catch(() => {}); state.isPlaying = true; } else { audio.pause(); state.isPlaying = false; }
        updateUI();
    }

    $('btn-play').addEventListener('click', togglePlay);
    $('mini-play').addEventListener('click', togglePlay);

    $('btn-next').addEventListener('click', () => nextSong(1));
    $('btn-prev').addEventListener('click', () => prevSong());

    function prevSong() {
        if (audio.currentTime > 3) { audio.currentTime = 0; return; }
        while (state.history.length) {
            const id = state.history.pop();
            if (id !== state.currentId && state.songs.some(s => s.id === id)) { playSong(id, { noHistory: true }); return; }
        }
        // Sin historial: en aleatorio (o con una sola canción) se reinicia la actual; si no, la anterior de la lista
        const pool = getPlayPool();
        if (state.shuffle || pool.length < 2) { audio.currentTime = 0; return; }
        const i = pool.findIndex(s => s.id === state.currentId);
        playSong(pool[(i <= 0 ? pool.length : i) - 1].id, { noHistory: true });
    }

    // Vuelta aleatoria: todas las canciones de la biblioteca mezcladas, sin repetir hasta que suenen todas
    function buildBag(excludeId, pool) {
        const ids = pool.map(x => x.id).filter(id => id !== excludeId);
        for (let i = ids.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [ids[i], ids[j]] = [ids[j], ids[i]];
        }
        return ids;
    }

    // La lista que suena: el artista o la playlist desde donde tocaste una canción, o toda la biblioteca
    function contextSongs(c) {
        if (!c) return null;
        if (c.type === 'artist') return artistSongs(c.key);
        if (c.type === 'list') { const pl = state.lists.find(l => l.id === c.id); return pl ? listSongs(pl) : []; }
        return null;
    }
    function getPlayPool() {
        const a = contextSongs(state.context);
        return a && a.length ? a : state.songs;
    }

    // Decide cuál suena después, sin cambiar nada. SIEMPRE usa toda la biblioteca: el texto del buscador
    // solo filtra lo que ves en pantalla, nunca lo que suena.
    // auto = true cuando la canción terminó sola (con "repetir: apagado" se detiene al final de la lista)
    function planNext(auto) {
        // 1) Primero lo que esté en Mi Lista, en el orden en que lo añadiste
        const q = state.playlist.find(id => state.songs.some(x => x.id === id));
        if (q) return { id: q };

        let pool = getPlayPool();
        if (state.songs.length === 0) return null;

        if (state.shuffle) {
            const valid = new Set(pool.map(x => x.id));
            if (shuffleBag === null) shuffleBag = buildBag(state.currentId, pool);   // vuelta nueva
            shuffleBag = shuffleBag.filter(id => valid.has(id) && id !== state.currentId);
            if (shuffleBag.length === 0) {
                // terminó la vuelta: con repetir apagado se detiene, si no, empieza otra
                if (auto && state.repeat === 'off' && state.currentId) return { stop: true };
                shuffleBag = buildBag(state.currentId, pool);
                if (shuffleBag.length === 0) shuffleBag = pool.map(x => x.id);   // solo hay una canción
            }
            return { id: shuffleBag[0] };
        }

        // Orden normal ("por filas")
        let idx = pool.findIndex(x => x.id === state.currentId);
        if (idx === -1 && pool !== state.songs) {   // la que suena viene de otro álbum o de Mi Lista: se sigue por la biblioteca
            pool = state.songs;
            idx = pool.findIndex(x => x.id === state.currentId);
        }
        if (idx === -1) return { id: pool[0].id };
        const n = idx + 1;
        if (auto && state.repeat === 'off' && n >= pool.length) return { stop: true };
        return { id: pool[n % pool.length].id };
    }

    function advance(auto) {
        const plan = planNext(auto);
        if (!plan) return;
        if (plan.stop) { endOfQueue(); return; }
        playSong(plan.id);
    }

    function nextSong(dir = 1, auto = false) {
        if (dir < 0) { prevSong(); return; }
        advance(auto);
    }

    // Se acabó la lista y "repetir" está apagado: se queda en la última canción, en pausa y al inicio
    function endOfQueue() {
        audio.pause();
        try { audio.currentTime = 0; } catch (e) {}
        state.isPlaying = false;
        updateUI();
    }

    // Botones de aleatorio y repetir
    const svgRepeat = '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
    const svgRepeatOne = '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>';

    function updateModeButtons() {
        $('btn-shuffle').classList.toggle('active', state.shuffle);
        $('btn-repeat').classList.toggle('active', state.repeat !== 'off');
        $('btn-repeat').innerHTML = state.repeat === 'one' ? svgRepeatOne : svgRepeat;
        $('btn-shuffle').setAttribute('aria-pressed', state.shuffle);
    }

    $('btn-shuffle').addEventListener('click', () => {
        state.shuffle = !state.shuffle;
        shuffleBag = null;
        saveModes();
        updateModeButtons();
        schedulePreload();
        showToast(state.shuffle ? '🔀 Aleatorio activado' : '➡️ Orden normal');
    });

    // Repetir: apagado → toda la lista → una canción
    $('btn-repeat').addEventListener('click', () => {
        state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
        saveModes();
        updateModeButtons();
        schedulePreload();
        showToast(state.repeat === 'off' ? 'Repetir: apagado' : state.repeat === 'all' ? '🔁 Repetir toda la lista' : '🔂 Repetir esta canción');
    });
    updateModeButtons();

    // Barra de progreso (siempre en escala 0–100)
    let seeking = false;
    const seekBar = $('seek-bar');
    seekBar.addEventListener('input', (e) => {
        seeking = true;
        if (audio.duration) {
            const t = (e.target.value / 100) * audio.duration;
            $('current-time').textContent = formatTime(t);
        }
    });
    seekBar.addEventListener('change', (e) => {
        if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
        seeking = false;
    });

    audio.addEventListener('timeupdate', () => {
        if (!audio.duration || seeking) return;
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        $('current-time').textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', () => {
        if (audio.src === SILENT) return;
        $('duration').textContent = formatTime(audio.duration);
        seekBar.value = 0;
        $('current-time').textContent = '0:00';
    });
    audio.addEventListener('ended', () => {
        if (state.repeat === 'one' && state.currentId) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } else {
            advance(true);   // el cambio es inmediato si la siguiente ya estaba cargada
        }
    });
    // Si el archivo se daña o no se puede decodificar a mitad de camino, se salta a la siguiente
    audio.addEventListener('error', () => {
        if (!state.currentId || !audio.getAttribute('src') || audio.src === SILENT) return;
        const song = state.songs.find(x => x.id === state.currentId);
        if (song) handlePlayError({ name: 'MediaError' }, song);
    });
    audio.addEventListener('play', () => { setMediaState(); if (state.currentId && audio.src !== SILENT) { state.isPlaying = true; updateUI(); } });
    audio.addEventListener('playing', setMediaState);
    audio.addEventListener('pause', () => { setMediaState(); if (state.currentId && audio.src !== SILENT && !audio.ended) { state.isPlaying = false; updateUI(); } });

    /* ============ Panel deslizable ============ */
    const panel = $('player-panel');
    const mini = $('mini-player');
    const PEEK = 170;   // alto visible del panel cerrado (igual que en el CSS)
    const isExpanded = () => panel.classList.contains('expanded');

    function expandPanel() {
        panel.style.transform = '';
        panel.classList.add('expanded');
        document.body.classList.add('panel-expanded');
        mini.classList.add('hidden');
    }

    function collapsePanel() {
        panel.style.transform = '';
        panel.classList.remove('expanded');
        document.body.classList.remove('panel-expanded');
        if (state.currentId) mini.classList.remove('hidden');
    }

    $('btn-collapse').addEventListener('click', () => { if (isExpanded()) collapsePanel(); else expandPanel(); });
    mini.addEventListener('click', (e) => { if (!e.target.closest('#mini-play')) expandPanel(); });

    // Arrastre: el panel sigue al dedo (abierto o cerrado) y al soltar termina el movimiento solo
    let drag = null, rafId = 0, pendingY = 0;
    const collapsedY = () => Math.max(0, panel.offsetHeight - PEEK);

    function applyDrag() {
        rafId = 0;
        if (drag) panel.style.transform = `translate3d(0, ${pendingY}px, 0)`;
    }

    panel.addEventListener('touchstart', (e) => {
        if (e.target.closest('button')) return;   // los botones funcionan con su propio toque
        const collapsed = !isExpanded();
        // Cerrado: se arrastra desde cualquier parte visible. Abierto: solo desde la zona de arriba.
        if (!collapsed && !e.target.closest('#drag-area')) return;
        const t = e.touches[0];
        drag = { startY: t.clientY, lastY: t.clientY, lastT: e.timeStamp, v: 0, collapsed, base: collapsed ? collapsedY() : 0 };
        pendingY = drag.base;
        panel.classList.add('dragging');
    }, { passive: true });

    panel.addEventListener('touchmove', (e) => {
        if (!drag) return;
        const y = e.touches[0].clientY;
        const dt = e.timeStamp - drag.lastT;
        if (dt > 0) drag.v = (y - drag.lastY) / dt;   // px/ms (negativo = hacia arriba)
        drag.lastY = y;
        drag.lastT = e.timeStamp;
        pendingY = Math.max(0, Math.min(drag.base + (y - drag.startY), collapsedY()));
        if (!rafId) rafId = requestAnimationFrame(applyDrag);
    }, { passive: true });

    function endDrag() {
        if (!drag) return;
        const d = drag;
        drag = null;
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        panel.classList.remove('dragging');
        const dy = d.lastY - d.startY;
        if (d.collapsed) {
            // toque, deslizar hacia arriba o un empujón rápido: se abre
            if (dy < -40 || d.v < -0.5 || Math.abs(dy) < 10) expandPanel(); else collapsePanel();
        } else {
            if (dy > 100 || d.v > 0.6) collapsePanel(); else expandPanel();
        }
    }
    panel.addEventListener('touchend', endDrag);
    panel.addEventListener('touchcancel', endDrag);

    window.resetDB = function() {
        if (confirm('¿Seguro que quieres borrar todas las canciones guardadas?')) {
            try { localStorage.removeItem(PLAYLIST_KEY); } catch (e) {}
            if (db) db.close();
            const req = indexedDB.deleteDatabase(DB_NAME);
            req.onsuccess = req.onerror = req.onblocked = () => location.reload();
        }
    };

    /* ============ Ventanas emergentes (hojas) ============ */
    let sheetEl = null, sheetOpenedAt = 0;
    function closeSheet() {
        if (!sheetEl) return;
        const el = sheetEl;
        sheetEl = null;
        el.classList.remove('show');
        document.body.classList.remove('sheet-open');
        setTimeout(() => el.remove(), 260);
    }
    // build(cuerpo, pie) llena la hoja
    function openSheet(title, build) {
        closeSheet();
        const ov = document.createElement('div');
        ov.className = 'sheet-overlay';
        ov.innerHTML = '<div class="sheet"><div class="sheet-grab"></div><div class="sheet-title"></div><div class="sheet-body"></div><div class="sheet-foot"></div></div>';
        ov.querySelector('.sheet-title').textContent = title;
        sheetOpenedAt = Date.now();
        // el dedo que acaba de soltar una pulsación larga no debe tocar nada de la hoja recién abierta
        ov.addEventListener('click', (e) => {
            if (Date.now() - sheetOpenedAt < 450) { e.stopPropagation(); e.preventDefault(); return; }
            if (e.target === ov) closeSheet();
        }, true);
        document.body.appendChild(ov);
        sheetEl = ov;
        document.body.classList.add('sheet-open');
        build(ov.querySelector('.sheet-body'), ov.querySelector('.sheet-foot'));
        requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('show')));
    }
    function sheetBtn(parent, label, icon, cls, onClick) {
        const b = document.createElement('button');
        b.className = 'sheet-btn' + (cls ? ' ' + cls : '');
        b.innerHTML = (icon || '') + '<span></span>';
        b.querySelector('span').textContent = label;
        b.addEventListener('click', onClick);
        parent.appendChild(b);
        return b;
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

    /* ============ Playlists ============ */
    function listSongs(pl) {
        const byId = new Map(state.songs.map(s => [s.id, s]));
        return pl.songs.map(id => byId.get(id)).filter(Boolean);
    }
    function addSongsToList(pl, ids) {
        let n = 0;
        for (const id of ids) {
            if (!pl.songs.includes(id) && state.songs.some(s => s.id === id)) { pl.songs.push(id); n++; }
        }
        savePlaylists();
        schedulePreload();
        return n;
    }
    const newListId = () => 'pl' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    // Foto elegida -> cuadrado de 320 px en JPEG (ocupa poco y se guarda dentro de la app)
    function imageToDataUrl(file, size) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                try {
                    const w = img.naturalWidth, h = img.naturalHeight;
                    if (!w || !h) throw new Error('imagen vacía');
                    const side = Math.min(w, h), out = Math.min(size, side);
                    const c = document.createElement('canvas');
                    c.width = c.height = out;
                    c.getContext('2d').drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, out, out);
                    URL.revokeObjectURL(url);
                    resolve(c.toDataURL('image/jpeg', 0.82));
                } catch (e) { URL.revokeObjectURL(url); reject(e); }
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
            img.src = url;
        });
    }

    // Crear (pl = null) o editar una playlist: nombre y foto
    function openListEditor(pl, done) {
        let photo = pl ? (pl.photo || '') : '';
        openSheet(pl ? 'Editar playlist' : 'Nueva playlist', (body, foot) => {
            const pick = document.createElement('div');
            pick.className = 'photo-pick';
            let removePhoto = null;
            const paint = () => {
                pick.innerHTML = photo ? `<img src="${photo}" alt="">` : `${svgCamera}<span>Añadir foto</span>`;
                if (removePhoto) removePhoto.style.display = photo ? '' : 'none';
            };
            const file = document.createElement('input');
            file.type = 'file'; file.accept = 'image/*'; file.style.display = 'none';
            pick.addEventListener('click', () => file.click());
            file.addEventListener('change', async () => {
                const f = file.files && file.files[0];
                file.value = '';
                if (!f) return;
                try { photo = await imageToDataUrl(f, 320); paint(); }
                catch (e) { showToast('❌ No se pudo usar esa foto'); }
            });
            const input = document.createElement('input');
            input.className = 'sheet-input';
            input.type = 'text';
            input.placeholder = 'Nombre de la playlist';
            input.maxLength = 60;
            input.value = pl ? pl.name : '';
            input.setAttribute('autocomplete', 'off');
            body.appendChild(pick);
            body.appendChild(file);
            body.appendChild(input);
            removePhoto = sheetBtn(body, 'Quitar foto', '', '', () => { photo = ''; paint(); });
            paint();
            if (pl) {
                sheetBtn(body, 'Eliminar playlist', svgTrash, 'danger', () => {
                    if (!confirm('¿Eliminar la playlist "' + pl.name + '"? Las canciones se quedan en la app.')) return;
                    state.lists = state.lists.filter(l => l.id !== pl.id);
                    if (state.listId === pl.id) state.listId = null;
                    if (state.context && state.context.type === 'list' && state.context.id === pl.id) state.context = null;
                    savePlaylists();
                    closeSheet();
                    renderSongs();
                    showToast('Playlist eliminada');
                });
            }
            sheetBtn(foot, pl ? 'Guardar' : 'Crear playlist', '', 'primary', () => {
                const name = input.value.trim();
                if (!name) { showToast('Escribe un nombre para la playlist'); input.focus(); return; }
                let target = pl;
                if (!target) { target = { id: newListId(), name, photo, songs: [], created: Date.now() }; state.lists.push(target); }
                else { target.name = name; target.photo = photo; }
                savePlaylists();
                closeSheet();
                if (done) done(target); else renderSongs();
            });
        });
    }

    // Elegir a qué playlist añadir una o varias canciones
    function openAddToList(ids) {
        openSheet('Añadir a playlist', (body) => {
            sheetBtn(body, 'Nueva playlist', svgPlus, 'primary', () => {
                closeSheet();
                setTimeout(() => openListEditor(null, (pl) => {
                    addSongsToList(pl, ids);
                    renderSongs();
                    showToast('✅ Añadida a "' + pl.name + '"');
                }), 280);
            }).style.marginBottom = '12px';
            for (const pl of state.lists) {
                const row = document.createElement('div');
                row.className = 'pick-row';
                row.innerHTML = `<div class="song-cover">${listCoverHtml(pl)}</div><div class="song-meta"><div class="song-title"></div><div class="song-artist"></div></div>`;
                row.querySelector('.song-title').textContent = pl.name;
                row.querySelector('.song-artist').textContent = countText(listSongs(pl).length);
                row.addEventListener('click', () => {
                    const n = addSongsToList(pl, ids);
                    closeSheet();
                    renderSongs();
                    showToast(n ? '✅ Añadida a "' + pl.name + '"' : 'Ya estaba en "' + pl.name + '"');
                });
                body.appendChild(row);
            }
            if (!state.lists.length) {
                const hint = document.createElement('div');
                hint.className = 'empty-state';
                hint.style.padding = '24px 10px';
                hint.textContent = 'Todavía no tienes playlists. Crea la primera.';
                body.appendChild(hint);
            }
        });
    }

    // Elegir varias canciones para meter en una playlist
    function openSongPicker(pl) {
        openSheet('Añadir canciones', (body, foot) => {
            const chosen = new Set();
            const candidates = state.songs.filter(s => !pl.songs.includes(s.id));
            const search = document.createElement('input');
            search.className = 'sheet-input';
            search.type = 'search';
            search.placeholder = 'Buscar canciones';
            search.setAttribute('autocomplete', 'off');
            const listEl = document.createElement('div');
            body.appendChild(search);
            body.appendChild(listEl);
            const addBtn = sheetBtn(foot, 'Elige canciones', '', 'primary', () => {
                if (!chosen.size) return;
                const n = addSongsToList(pl, [...chosen]);
                closeSheet();
                renderSongs();
                showToast('✅ ' + n + (n === 1 ? ' canción añadida' : ' canciones añadidas'));
            });
            const label = () => {
                addBtn.querySelector('span').textContent = chosen.size ? 'Añadir ' + countText(chosen.size) : 'Elige canciones';
                addBtn.style.opacity = chosen.size ? '1' : '0.5';
            };
            const paint = () => {
                listEl.innerHTML = '';
                const q = norm(search.value).trim();
                const items = q ? candidates.filter(s => norm([s.name, s.title, s.artist, s.album].filter(Boolean).join(' ')).includes(q)) : candidates;
                if (!items.length) {
                    const e = document.createElement('div');
                    e.className = 'empty-state';
                    e.style.padding = '30px 10px';
                    e.textContent = candidates.length ? 'Sin resultados' : 'Todas tus canciones ya están en esta playlist';
                    listEl.appendChild(e);
                    return;
                }
                for (const s of items) {
                    const row = document.createElement('div');
                    row.className = 'pick-row' + (chosen.has(s.id) ? ' sel' : '');
                    row.innerHTML = `<div class="song-cover">${coverImg(s) || svgMusic}</div>
                        <div class="song-meta"><div class="song-title"></div><div class="song-artist"></div></div><div class="pick-check">${chosen.has(s.id) ? '✓' : ''}</div>`;
                    row.querySelector('.song-title').textContent = songTitle(s);
                    row.querySelector('.song-artist').textContent = s.artist;
                    row.addEventListener('click', () => {
                        if (chosen.has(s.id)) chosen.delete(s.id); else chosen.add(s.id);
                        row.classList.toggle('sel', chosen.has(s.id));
                        row.querySelector('.pick-check').textContent = chosen.has(s.id) ? '✓' : '';
                        label();
                    });
                    listEl.appendChild(row);
                }
            };
            search.addEventListener('input', paint);
            paint();
            label();
        });
    }

    // Menú de una canción (pulsación larga, clic derecho o el botón del reproductor)
    function openSongActions(song) {
        const tab = state.currentTab;
        openSheet(songTitle(song), (body) => {
            sheetBtn(body, 'Añadir a playlist', svgPlus, '', () => { closeSheet(); setTimeout(() => openAddToList([song.id]), 280); });
            sheetBtn(body, 'Añadir a Mi Lista', svgPlus, '', () => { addToPlaylist(song.id); closeSheet(); });
            if (tab === 'queue') sheetBtn(body, 'Quitar de Mi Lista', svgTrash, '', () => { closeSheet(); removeFromQueue(song.id); });
            if (tab === 'lists' && state.listId !== null) sheetBtn(body, 'Quitar de esta playlist', svgTrash, '', () => { const id = state.listId; closeSheet(); removeFromList(id, song.id); });
            sheetBtn(body, 'Borrar de la app', svgTrash, 'danger', () => { closeSheet(); deleteSong(song.id, 'library'); });
        });
    }
    // Botón del reproductor: muestra Mi Lista (lo que sonará a continuación) sin salir del reproductor
    function openQueueSheet() {
        openSheet('Mi Lista', (body, foot) => {
            const paint = () => {
                body.innerHTML = '';
                const songs = state.playlist.map(id => state.songs.find(x => x.id === id)).filter(Boolean);
                if (!songs.length) {
                    const e = document.createElement('div');
                    e.className = 'empty-state';
                    e.style.padding = '30px 10px';
                    e.innerHTML = 'Tu lista está vacía.<br>Desliza una canción a la derecha para añadirla.';
                    body.appendChild(e);
                }
                for (const song of songs) {
                    const row = document.createElement('div');
                    row.className = 'pick-row';
                    row.innerHTML = `<div class="song-cover">${coverImg(song) || svgMusic}</div>
                        <div class="song-meta"><div class="song-title"></div><div class="song-artist"></div></div>
                        <button class="icon-btn q-del" aria-label="Quitar" style="color:var(--gray)">${svgTrash}</button>`;
                    row.querySelector('.song-title').textContent = songTitle(song);
                    row.querySelector('.song-artist').textContent = song.artist;
                    row.addEventListener('click', () => { closeSheet(); playSong(song.id); });
                    row.querySelector('.q-del').addEventListener('click', (e) => {
                        e.stopPropagation();
                        state.playlist = state.playlist.filter(x => x !== song.id);
                        savePlaylist(); schedulePreload(); renderSongs(); paint();
                    });
                    body.appendChild(row);
                }
            };
            paint();
            if (state.playlist.length) sheetBtn(foot, 'Vaciar Mi Lista', svgTrash, 'danger', () => {
                state.playlist = []; savePlaylist(); schedulePreload(); renderSongs(); paint(); foot.innerHTML = '';
            }).style.marginBottom = '0';
        });
    }
    $('btn-song-menu').addEventListener('click', openQueueSheet);
    $('btn-song-menu').setAttribute('aria-label', 'Mi Lista');

    /* ============ Barra superior: aparece al subir un poco ============ */
    (function () {
        const bar = $('sticky-bar');
        const head = document.querySelector('header');
        const search = $('search-input');
        let barTop = 0, lastY = 0, run = 0, ticking = false;
        const measure = () => { barTop = head.offsetHeight; };
        const setHidden = (h) => bar.classList.toggle('hide', h);

        function onScroll() {
            ticking = false;
            const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
            const y = Math.max(0, Math.min(window.scrollY, maxY));   // ignora el rebote de iOS arriba y abajo
            const dy = y - lastY;
            lastY = y;
            // Arriba del todo, o escribiendo en el buscador: siempre visible
            if (y <= barTop + 4 || document.activeElement === search) { setHidden(false); run = 0; return; }
            if (dy === 0) return;
            if ((dy > 0) !== (run > 0)) run = 0;   // cambió el sentido: se cuenta de nuevo
            run += dy;
            if (run > 10) setHidden(true);          // bajando: se esconde
            else if (run < -8) setHidden(false);    // subiendo un poquito: aparece
        }
        window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
        window.addEventListener('resize', measure);
        window.addEventListener('orientationchange', measure);
        window.addEventListener('load', measure);
        measure();
    })();

    /* ============ Inicio ============ */
    (async function init() {
        try {
            await initDB();
            dbOk = true;
            // Pide que el navegador no borre los datos de la app
            if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
            state.songs = (await getSongsFromDB()).sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
            // Limpia de la lista las canciones que ya no existen
            const ids = new Set(state.songs.map(s => s.id));
            state.playlist = state.playlist.filter(id => ids.has(id));
            savePlaylist();
            if (state.songs.length) { state.lists.forEach(l => { l.songs = l.songs.filter(id => ids.has(id)); }); savePlaylists(); }
        } catch (err) {
            console.error('No se pudo abrir la base de datos:', err);
            dbOk = false;
            dbError = errName(err);
            showToast('⚠️ No se puede guardar en este navegador (' + dbError + '). Si usas una pestaña privada, ábrela en una normal.', 8000);
        }

        const msg = $('empty-msg');
        if (msg) msg.style.display = 'none';
        renderSongs();
        // En segundo plano: lee las etiquetas e imágenes de las canciones ya guardadas y quita las repetidas
        (async () => {
            await backfillCovers();
            const n = await cleanDuplicates();
            if (n) { renderSongs(); showToast('🧹 Se quitaron ' + n + (n === 1 ? ' canción repetida' : ' canciones repetidas'), 4500); }
        })();
    })();
</script>
